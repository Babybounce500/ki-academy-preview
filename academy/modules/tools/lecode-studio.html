<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"/>
    <title>NextGen AI Development Studio - LeCode Fusion</title>
    
    <!-- External CDN Libraries -->
    <link href="https://unpkg.com/spectre.css/dist/spectre.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ace.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.28.0/themes/prism-tomorrow.min.css" rel="stylesheet"/>
    <!-- Consolidated Styles: LeCode CSS + Inline Styles -->
    <style>
        /* BASE STYLES */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Orbitron', 'Helvetica Neue', sans-serif;
            background-color: #121212;
            color: #ffffff;
        }

        /* NAVBAR */
        .navbar {
            background: #1a1a2e;
            color: #FFFFFF;
            padding: 5px 15px;
            font-size: 18px;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            height: 40px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        #matrixCanvas {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0.4;
            pointer-events: none;
        }

        .navbar span {
            position: relative;
            z-index: 10;
            text-shadow: 0 0 10px #FFFFFF, 0 0 20px rgba(0, 255, 255, 0.5);
        }

        /* CONTAINER */
        .container {
            padding: 0;
            display: flex;
            flex-direction: column;
            height: calc(100% - 40px);
        }

        /* CHAT CONTAINER */
        #chat-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            background: #1e1e1e;
            overflow: hidden;
            position: relative;
            margin: 0;
        }

        #chatHistory {
            flex-grow: 1;
            padding: 10px;
            overflow-y: auto;
            border-radius: 4px;
            background: #1e1e1e;
            word-wrap: break-word;
            color: #fff;
            scrollbar-width: thin;
            scrollbar-color: #888 #333;
        }

        #chatHistory::-webkit-scrollbar {
            width: 8px;
        }

        #chatHistory::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        #chatHistory::-webkit-scrollbar-track {
            background: #333;
        }

        .user-message, .assistant-message {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            transition: background-color 0.3s;
            white-space: pre-wrap;
        }

        .user-message {
            background-color: #4b0082;
            text-align: left;
        }

        .assistant-message {
            background-color: #008000;
            text-align: left;
        }

        /* INPUT GROUP */
        .input-group {
            display: flex;
            width: 100%;
            margin-top: auto;
            position: sticky;
            bottom: 0;
            background-color: #1e1e1e;
            padding: 10px 0;
        }

        .input-group input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px 0 0 4px;
            font-size: 16px;
            background-color: #fff;
            color: #333;
        }

        .input-group button {
            padding: 10px;
            border: none;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            border-radius: 0 4px 4px 0;
            font-size: 16px;
        }

        .input-group button:hover {
            background-color: #0056b3;
        }

        /* BUTTONS */
        .form-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .form-buttons button {
            flex: 1 1 18%;
            padding: 5px;
            font-size: 14px;
        }

        /* LOADING SPINNER */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            display: none;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 8px;
        }

        #loading .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* FILE PREVIEW */
        .file-preview {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
            padding: 10px;
            background-color: #1a1a2e;
            border-radius: 4px;
            min-height: 30px;
        }

        .file-preview-item {
            padding: 5px 10px;
            background-color: #0099ff;
            color: white;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
        }

        .file-preview-item button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-weight: bold;
            padding: 0;
        }

        /* CODE BLOCKS */
        pre {
            background: #2d2d2d;
            padding: 10px;
            border-radius: 5px;
            overflow: auto;
        }

        code {
            font-family: 'Fira Code', monospace;
        }

        .highlighted {
            background-color: #ffeb3b;
            color: #000;
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 600px) {
            .navbar {
                flex-direction: column;
                align-items: flex-start;
                padding: 5px 10px;
                height: auto;
            }
            .container {
                height: calc(100% - 50px);
            }
            #chat-container {
                height: 100%;
                margin-bottom: 0;
            }
            #chatHistory {
                height: calc(100% - 80px);
            }
            .input-group {
                margin-top: 0;
            }
            .form-buttons {
                flex-wrap: nowrap;
                overflow-x: auto;
            }
            .form-buttons button {
                flex: 0 0 auto;
                width: 20%;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <canvas id="matrixCanvas"></canvas>
        <span style="font-family: 'Orbitron', sans-serif; font-weight: 900; letter-spacing: 2px;">Genitus Inc - LeCode</span>
        <div style="display: flex; gap: 15px; align-items: center;">
            <label style="display: flex; align-items: center; gap: 6px; color: #0099ff; cursor: pointer; font-size: 12px;">
                <input type="checkbox" id="autoContinueCheckbox" onchange="toggleAutoContinue()" style="cursor: pointer; width: 14px; height: 14px;">
                <span>Auto-Continue</span>
            </label>
            <select id="modelSelect" onchange="switchModel()" style="padding: 5px 10px; border-radius: 4px; border: 1px solid #0099ff; background-color: #1e1e1e; color: #fff; cursor: pointer;">
                <option value="mistral">🔮 Codestral</option>
                <option value="claude">🤖 Claude 4.5</option>
            </select>
        </div>
    </div>

    <div class="container">
        <div id="chat-container">
            <div id="chatHistory"></div>
            <div id="loading">
                <div class="spinner"></div>
            </div>

            <div class="file-preview" id="filePreview">
                <span style="color: #9ca3af;">Keine Datei angehängt</span>
            </div>

            <div class="input-group">
                <textarea class="form-input" id="userPrompt" rows="1" enterkeyhint="send" placeholder="Was soll ich bauen?" title="Enter sendet, Shift+Enter neue Zeile" aria-label="Nachricht"></textarea>
                <button class="btn btn-primary input-group-btn" onclick="fetchChatCompletion()">
                    <i class="fas fa-paper-plane"></i> Senden
                </button>
            </div>

            <div class="form-buttons">
                <button class="btn btn-success" onclick="runGeneratedHtml()"><i class="fas fa-play"></i>HTML</button>
                <button class="btn btn-primary" onclick="window.open('https://html-editor.replit.app', '_blank')"><i class="fas fa-edit"></i>Editor</button>
                <button class="btn btn-info" onclick="downloadSnippet()"><i class="fas fa-download"></i>DL</button>
                <button class="btn btn-warning" onclick="highlightLastAssistantResponse()"><i class="fas fa-highlighter"></i>Copy</button>
                <button class="btn btn-secondary" onclick="continueMessage()" style="display: none;" title="Continue incomplete response"><i class="fas fa-ellipsis-h"></i>Continue</button>
                
                <input type="file" id="chatFileInput" class="form-input" style="display:none;" onchange="uploadChatFile()">
                <input type="file" id="mediaFileInput" class="form-input" style="display:none;" accept="image/*,application/pdf" onchange="uploadMediaFile()">
                
                <button class="btn btn-secondary" onclick="document.getElementById('chatFileInput').click()">
                    <i class="fas fa-upload"></i>TXT
                </button>
                <button class="btn btn-secondary" onclick="document.getElementById('mediaFileInput').click()">
                    <i class="fas fa-image"></i>Media
                </button>
                
                <button class="btn btn-danger" onclick="deleteUploadedFile()"><i class="fas fa-trash"></i>Delete</button>
                <button class="btn btn-dark" onclick="clearChatHistory()"><i class="fas fa-times"></i>Clear</button>
                <button class="btn btn-warning" onclick="saveConversation()"><i class="fas fa-save"></i>Convo</button>
            </div>
        </div>
    </div>

    <textarea id="generatedHtml" style="display:none;"></textarea>

    <!-- External JavaScript Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ace.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ext-language_tools.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.28.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.28.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.28.0/components/prism-html.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.28.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- Consolidated JavaScript: All LeCode Functions -->
    <script>
        // ╔════════════════════════════════════════════════════════════════╗
        // ║         LeCode AI - Dual Model System (Mistral + Claude)       ║
        // ║                   STANDALONE MONOLITH EDITION                  ║
        // ╚════════════════════════════════════════════════════════════════╝

        const MISTRAL_ENDPOINT = 'https://theserver-open-ai.replit.app/mistral/chat';
        const CLAUDE_ENDPOINT = 'https://theserver-open-ai.replit.app/claude/messages';

        let currentModel = 'mistral';
        let chatHistory = [];
        let uploadedFiles = [];
        let isLoading = false;
        let isIncomplete = false;
        let autoContinueEnabled = false;
        let continuationTimeout = null;
        let updateScheduled = false;
        /* ===== Stabilitaets-Schicht ===== */

  var LC_MAX_CONT = 8;
  var LC_CONT_PROMPT = 'Deine letzte Antwort wurde abgeschnitten. Setze sie nahtlos genau an der abgebrochenen Stelle fort. Wiederhole nichts und beginne nicht neu.';
  var lcStop = null, lcAbort = null, lcContCount = 0, lcContMode = false, lcLastPrompt = '';
  var LC_BUDGET = 46000;

  function lcSleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function lcToast(msg) { try { if (window.AHS && AHS.toast) { AHS.toast(msg); return; } } catch (e) {} console.log(msg); }

  async function lcFetch(url, opts) {
    lcAbort = new AbortController();
    var o = Object.assign({}, opts, { signal: lcAbort.signal });
    var last;
    for (var i = 0; i < 3; i++) {
      try {
        var r = await fetch(url, o);
        if ((r.status === 429 || r.status >= 502) && i < 2) { lcToast('Server ausgelastet, neuer Versuch ...'); await lcSleep(1500 * (i + 1)); continue; }
        return r;
      } catch (e) {
        if (e && e.name === 'AbortError') throw e;
        last = e;
        if (i < 2) { lcToast('Verbindung unterbrochen, neuer Versuch ...'); await lcSleep(1500 * (i + 1)); }
      }
    }
    var err = new Error('Keine Verbindung zum KI-Server. Bitte Internet pruefen und erneut senden.');
    err.code = 'NETWORK'; err.cause = last; throw err;
  }

  function lcHttpError(status, data) {
    var raw = data && (data.error && (data.error.message || data.error.code || data.error) || data.message) || '';
    if (typeof raw !== 'string') { try { raw = JSON.stringify(raw); } catch (e) { raw = ''; } }
    var code = String((data && (data.error && data.error.code || data.error)) || '');
    var msg;
    if (/INPUT_TOKEN_LIMIT/.test(code + raw)) { msg = 'Die Anfrage war fuer den KI-Zugang zu gross (zu viel Verlauf oder zu grosse Datei/Bild). Starte einen neuen Chat oder sende weniger Text.'; code = 'INPUT_TOKEN_LIMIT'; }
    else if (/SESSION_TOKEN_BUDGET|BUDGET/.test(code + raw)) { msg = 'Das Kontingent des KI-Zugangs ist gerade aufgebraucht. Bitte spaeter erneut versuchen.'; code = 'BUDGET'; }
    else if (status === 429) { msg = 'Zu viele Anfragen in kurzer Zeit. Bitte einen Moment warten und erneut senden.'; code = 'RATE'; }
    else if (status >= 500) { msg = 'Der KI-Server hat gerade ein Problem (HTTP ' + status + '). Bitte gleich erneut versuchen.'; code = 'SERVER'; }
    else msg = raw || ('HTTP ' + status);
    var e = new Error(msg); e.code = code || ('HTTP' + status); e.status = status; return e;
  }

  // Liest einen SSE-Stream (Mistral/OpenAI- und Claude-Format) robust: Zeilen werden gepuffert, UTF-8 korrekt dekodiert.
  async function lcReadStream(response, onChunk) {
    var reader = response.body.getReader(), decoder = new TextDecoder('utf-8'), buf = '', full = '', sawEnd = false;
    lcStop = null;
    function handle(line) {
      line = line.replace(/\r$/, '');
      if (line.indexOf('data:') !== 0) return;
      var data = line.slice(5).trim();
      if (!data) return;
      if (data === '[DONE]') { sawEnd = true; return; }
      var p; try { p = JSON.parse(data); } catch (e) { return; }
      if (p.type === 'error' || (p.error && !p.choices)) { var em = (p.error && (p.error.message || p.error)) || 'Stream-Fehler'; var er = new Error(typeof em === 'string' ? em : JSON.stringify(em)); er.code = 'STREAM'; throw er; }
      var text = null;
      if (p.type === 'content_block_delta' && p.delta && typeof p.delta.text === 'string') text = p.delta.text;
      else if (p.choices && p.choices[0]) {
        var ch = p.choices[0];
        if (ch.delta && typeof ch.delta.content === 'string') text = ch.delta.content;
        else if (ch.delta && typeof ch.delta.text === 'string') text = ch.delta.text;
        if (ch.finish_reason) { lcStop = ch.finish_reason; sawEnd = true; }
      } else if (p.delta && typeof p.delta.text === 'string') text = p.delta.text;
      if (p.type === 'message_delta' && p.delta && p.delta.stop_reason) { lcStop = p.delta.stop_reason; sawEnd = true; }
      if (p.type === 'message_stop') sawEnd = true;
      if (text) { onChunk(text); full += text; }
    }
    try {
      while (true) {
        var res = await reader.read();
        if (res.done) break;
        buf += decoder.decode(res.value, { stream: true });
        var lines = buf.split('\n'); buf = lines.pop();
        for (var i = 0; i < lines.length; i++) handle(lines[i]);
      }
      buf += decoder.decode();
      if (buf) handle(buf);
    } catch (e) {
      if (e && e.name === 'AbortError') { lcStop = 'aborted'; return full; }
      if (full) { lcStop = 'cut'; return full; }
      throw e;
    } finally { try { reader.cancel(); } catch (e2) {} }
    if (!lcStop && !sawEnd && full) lcStop = 'cut';
    return full;
  }

  function lcFencesOdd(t) { return ((t.match(/```/g) || []).length % 2) === 1; }
  function lcIsIncomplete(resp) {
    if (lcStop === 'max_tokens' || lcStop === 'length' || lcStop === 'aborted' || lcStop === 'cut') return true;
    var lastMsg = chatHistory[chatHistory.length - 1];
    return lcFencesOdd((lastMsg && lastMsg.role === 'assistant' && lastMsg.content) ? lastMsg.content : (resp || ''));
  }

  // Anfrage vorbereiten: Fortsetzungs-Aufforderung anhaengen, Verlauf kuerzen, alte Bilder weglassen
  function lcPrep(messages) {
    var msgs = messages.map(function (m) { return m; });
    var lastUser = -1; for (var i = msgs.length - 1; i >= 0; i--) if (msgs[i].role === 'user') { lastUser = i; break; }
    msgs = msgs.map(function (m, idx) {
      if (m.role === 'user' && Array.isArray(m.content) && idx !== lastUser) {
        var hadImg = m.content.some(function (b) { return b.type === 'image'; });
        if (!hadImg) return m;
        var txt = m.content.filter(function (b) { return b.type === 'text'; });
        txt.push({ type: 'text', text: '[Bild aus frueherer Nachricht nicht erneut gesendet]' });
        return { role: 'user', content: txt };
      }
      return m;
    });
    if (lcContMode) msgs.push({ role: 'user', content: LC_CONT_PROMPT });
    var size = function (a) { var n = 0; a.forEach(function (m) { n += typeof m.content === 'string' ? m.content.length : JSON.stringify(m.content).length; }); return n; };
    var dropped = 0;
    while (msgs.length > 1 && size(msgs) > LC_BUDGET) {
      msgs.shift(); dropped++;
      while (msgs.length > 1 && msgs[0].role !== 'user') { msgs.shift(); dropped++; }
    }
    if (dropped) lcToast('Aelteren Chatverlauf fuer diese Anfrage gekuerzt (' + dropped + ' Nachrichten).');
    return msgs;
  }

  function lcShowError(error, phase) {
    var aborted = error && error.name === 'AbortError';
    var last = chatHistory[chatHistory.length - 1];
    if (aborted) {
      lcToast('Abgebrochen');
      if (last && last.role === 'assistant' && last.content && last.content.trim()) isIncomplete = true;
      else if (last && last.role === 'assistant') { chatHistory.pop(); }
      try { updateChatDisplay(); updateButtonStates(); } catch (e) {}
      return;
    }
    console.error('LeCODE Fehler:', error);
    var msg = (error && error.message) || String(error);
    var hasPartial = !!(last && last.role === 'assistant' && last.content && last.content.trim());
    var restored = false;
    if (last && last.role === 'assistant' && !hasPartial) chatHistory.pop();
    if (hasPartial) isIncomplete = true;
    else if (phase === 'senden') {
      var u = chatHistory[chatHistory.length - 1];
      if (u && u.role === 'user' && u.content === lcLastPrompt) {
        chatHistory.pop(); restored = true;
        setTimeout(function () { if (userPromptElement && !userPromptElement.value) userPromptElement.value = lcLastPrompt; }, 0);
      }
    }
    try { updateChatDisplay(); updateButtonStates(); } catch (e) {}
    try {
      var note = document.createElement('div'); note.className = 'assistant-message lc-error';
      note.style.cssText = 'border-color:#b45309;color:#fde68a;white-space:pre-wrap';
      note.textContent = '⚠️ ' + msg + (restored ? '\n\nDeine Nachricht steht wieder im Eingabefeld. Mit Senden erneut versuchen.' : (hasPartial ? '\n\nMit "Fortsetzen" weitermachen.' : ''));
      chatHistoryElement.appendChild(note); chatHistoryElement.scrollTop = chatHistoryElement.scrollHeight;
    } catch (e) {}
  }

  function lcAutosave() {
    try {
      var slim = chatHistory.filter(function (m) { return !(m.role === 'assistant' && /^⚠️ /.test(m.content || '')); }).map(function (m) {
        if (!m.files || !m.files.length) return m;
        var c = Object.assign({}, m); c.files = m.files.map(function (f) { return { name: f.name, type: f.type }; }); c.files = null; c.content = m.content + '\n[Anhang: ' + m.files.map(function (f) { return f.name; }).join(', ') + ']'; return c;
      });
      localStorage.setItem('chatHistory', JSON.stringify(slim));
    } catch (e) { /* Speicher voll: Autosave ueberspringen */ }
  }
  window.lcStopNow = function () { if (lcAbort) { try { lcAbort.abort(); } catch (e) {} } };

        /* ===== Ende Stabilitaets-Schicht ===== */

        let userPromptElement = document.getElementById("userPrompt");
        let chatHistoryElement = document.getElementById("chatHistory");
        let filePreviewElement = document.getElementById("filePreview");

        // Throttled chat display update
        function scheduleUpdateChatDisplay() {
            if (updateScheduled) return;
            updateScheduled = true;
            requestAnimationFrame(() => {
                updateChatDisplay();
                updateScheduled = false;
            });
        }

        // Configure PDF.js
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        // ══════════════════════ MODEL SWITCHING ══════════════════════
        function switchModel() {
            const newModel = document.getElementById('modelSelect').value;
            currentModel = newModel;
            localStorage.setItem('selectedModel', currentModel);
            isIncomplete = false;
        }

        // ══════════════════════ AUTO-CONTINUE TOGGLE ══════════════════════
        function toggleAutoContinue() {
            const checkbox = document.getElementById('autoContinueCheckbox');
            if (checkbox) {
                autoContinueEnabled = checkbox.checked;
                localStorage.setItem('autoContinueEnabled', autoContinueEnabled);
            }
        }

        // ══════════════════════ FILE UPLOAD HANDLERS ══════════════════════
        async function uploadMediaFile() {
            const fileInput = document.getElementById("mediaFileInput");
            const file = fileInput.files[0];
            if (!file) return;

            if (file.type.startsWith('image/')) {
                handleImageUpload(file);
            } else if (file.type === 'application/pdf') {
                handlePDFUpload(file);
            } else {
                alert("Only images (JPEG, PNG, GIF, WebP) and PDFs supported");
            }
            fileInput.value = '';
        }

        function handleImageUpload(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result;
                uploadedFiles.push({
                    name: file.name,
                    type: 'image',
                    mediaType: file.type,
                    base64: base64Data
                });
                updateFilePreview();
            };
            reader.readAsDataURL(file);
        }

        function handlePDFUpload(file) {
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const typedarray = new Uint8Array(e.target.result);
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    
                    let fullText = `PDF: ${file.name} (${pdf.numPages} pages)\n\n`;
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        const pageText = textContent.items.map(item => item.str).join(' ');
                        fullText += `--- Page ${i} ---\n${pageText}\n\n`;
                    }

                    uploadedFiles.push({
                        name: file.name,
                        type: 'pdf',
                        text: fullText,
                        pages: pdf.numPages
                    });
                    updateFilePreview();

                    if (currentModel === 'claude') {
                        const firstPage = await pdf.getPage(1);
                        const viewport = firstPage.getViewport({ scale: 1.5 });
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;

                        await firstPage.render({
                            canvasContext: ctx,
                            viewport: viewport
                        }).promise;

                        const imageBase64 = canvas.toDataURL('image/png').split(',')[1];
                        uploadedFiles[uploadedFiles.length - 1].imageBase64 = imageBase64;
                    }
                } catch (error) {
                    alert('Error processing PDF: ' + error.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function updateFilePreview() {
            if (uploadedFiles.length === 0) {
                filePreviewElement.innerHTML = '';
                filePreviewElement.style.display = 'none';
            } else {
                filePreviewElement.style.display = 'block';
                filePreviewElement.innerHTML = uploadedFiles.map((file, idx) => `
                    <div class="file-preview-item">
                        <i class="fas fa-${file.type === 'image' ? 'image' : 'file-pdf'}"></i>
                        ${file.name} <button onclick="removeFile(${idx})">×</button>
                    </div>
                `).join('');
            }
        }

        function removeFile(index) {
            uploadedFiles.splice(index, 1);
            updateFilePreview();
        }

        // ══════════════════════ MAIN API CALL WITH STREAMING ══════════════════════
        async function fetchChatCompletion() {
            if (isLoading) { lcToast("Bitte warten, die Antwort laeuft noch."); return; }
            const prompt = userPromptElement.value.trim();
            if (!prompt) { lcToast("Bitte eine Nachricht eingeben"); return; }
            lcLastPrompt = prompt; lcContCount = 0; lcContMode = false;

            isLoading = true;
            document.getElementById('loading').style.display = 'block';
            updateButtonStates();

            const userMessage = {
                role: 'user',
                content: prompt,
                files: uploadedFiles.length > 0 ? uploadedFiles : null,
                model: currentModel
            };
            chatHistory.push(userMessage);
            updateChatDisplay();

            try {
                let response = '';
                const assistantMessageIndex = chatHistory.length;
                
                chatHistory.push({
                    role: 'assistant',
                    content: '',
                    model: currentModel
                });
                
                if (currentModel === 'mistral') {
                    response = await callMistralAPIStream(prompt, (chunk) => {
                        chatHistory[assistantMessageIndex].content += chunk;
                        scheduleUpdateChatDisplay();
                        document.getElementById('generatedHtml').value = chatHistory[assistantMessageIndex].content;
                    });
                } else if (currentModel === 'claude') {
                    response = await callClaudeAPIStream(prompt, (chunk) => {
                        chatHistory[assistantMessageIndex].content += chunk;
                        scheduleUpdateChatDisplay();
                        document.getElementById('generatedHtml').value = chatHistory[assistantMessageIndex].content;
                    });
                } else {
                    throw new Error('Unknown model: ' + currentModel);
                }
                
                updateChatDisplay();

                isIncomplete = lcIsIncomplete(response);
                
                updateButtonStates();

                if (autoContinueEnabled && isIncomplete && lcContCount < LC_MAX_CONT) {
                    if (continuationTimeout) clearTimeout(continuationTimeout);
                    continuationTimeout = setTimeout(() => {
                        continueMessage();
                    }, 2000);
                }
            } catch (error) {
                console.error("Error:", error);
                lcShowError(error, 'senden');
            } finally {
                lcAutosave();
                isLoading = false;
                document.getElementById('loading').style.display = 'none';
                if (!window.__lcKeepPrompt) userPromptElement.value = "";
                uploadedFiles = [];
                updateFilePreview();
                updateButtonStates();
            }
        }

        // ══════════════════════ CONTINUE MESSAGE (STREAMING) ══════════════════════
        async function continueMessage() {
            if (!isIncomplete || isLoading) return;
            
            isLoading = true;
            document.getElementById('loading').style.display = 'block';
            updateButtonStates();

            try {
                const continuePrompt = LC_CONT_PROMPT; lcContMode = true; lcContCount++;
                let response = '';
                const lastMessageIndex = chatHistory.length - 1;
                
                if (currentModel === 'mistral') {
                    response = await callMistralAPIStream(continuePrompt, (chunk) => {
                        chatHistory[lastMessageIndex].content += chunk;
                        scheduleUpdateChatDisplay();
                        document.getElementById('generatedHtml').value = chatHistory[lastMessageIndex].content;
                    });
                } else if (currentModel === 'claude') {
                    response = await callClaudeAPIStream(continuePrompt, (chunk) => {
                        chatHistory[lastMessageIndex].content += chunk;
                        scheduleUpdateChatDisplay();
                        document.getElementById('generatedHtml').value = chatHistory[lastMessageIndex].content;
                    });
                } else {
                    throw new Error('Unknown model for continue: ' + currentModel);
                }
                
                updateChatDisplay();
                
                if (chatHistory.length > 0 && chatHistory[lastMessageIndex].role === 'assistant') {
                    isIncomplete = lcIsIncomplete(response);
                    
                    updateButtonStates();

                    if (autoContinueEnabled && isIncomplete && lcContCount < LC_MAX_CONT) {
                        if (continuationTimeout) clearTimeout(continuationTimeout);
                        continuationTimeout = setTimeout(() => {
                            continueMessage();
                        }, 1500);
                    }
                }
            } catch (error) {
                console.error("Continue error:", error);
                lcShowError(error, 'fortsetzen');
            } finally {
                lcContMode = false; lcAutosave();
                isLoading = false;
                document.getElementById('loading').style.display = 'none';
                updateButtonStates();
            }
        }

        function updateButtonStates() {
            var stopB = document.getElementById('lcStop'); if (stopB) stopB.style.display = isLoading ? '' : 'none';
            const sendBtn = document.querySelector('button[onclick="fetchChatCompletion()"]');
            const continueBtn = document.querySelector('button[onclick="continueMessage()"]');
            
            if (sendBtn) sendBtn.style.display = isLoading ? 'none' : 'block';
            if (continueBtn) continueBtn.style.display = (isIncomplete && !isLoading) ? 'block' : 'none';
        }

        // ══════════════════════ MISTRAL API - STREAMING ══════════════════════
        async function callMistralAPIStream(prompt, onChunk) {
            const messages = chatHistory
                .filter(msg => {
                    if (msg.role === 'user') {
                        return !msg.files || msg.files.length === 0;
                    }
                    return msg.role === 'assistant' && msg.model === 'mistral' && msg.content.trim().length > 0;
                })
                .map(msg => ({
                    role: msg.role,
                    content: msg.content
                }));

            const requestBody = {
                model: "codestral-latest",
                temperature: 0.7,
                top_p: 1,
                max_tokens: 256000,
                stream: true,
                messages: [
                    { 
                        role: "system", 
                        content: "You are a high-end senior web developer with expertise in HTML5, CSS3, Media Queries, and JavaScript." 
                    },
                    ...lcPrep(messages)
                ],
                response_format: { type: 'text' },
                safe_prompt: false
            };

            const response = await lcFetch(MISTRAL_ENDPOINT, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({ error: 'Unknown error' }));
                throw lcHttpError(response.status, errorData);
            }

            return await lcReadStream(response, onChunk);
        }

        // ══════════════════════ CLAUDE API - STREAMING ══════════════════════
        async function callClaudeAPIStream(prompt, onChunk) {
            const messages = [];

            chatHistory.forEach(msg => {
                if (msg.role === 'user') {
                    const content = [];
                    
                    if (msg.files && msg.files.length > 0) {
                        msg.files.forEach(file => {
                            if (file.type === 'image') {
                                content.push({
                                    type: 'image',
                                    source: {
                                        type: 'base64',
                                        media_type: file.mediaType,
                                        data: file.base64.split(',')[1]
                                    }
                                });
                            } else if (file.type === 'pdf' && file.imageBase64) {
                                content.push({
                                    type: 'image',
                                    source: {
                                        type: 'base64',
                                        media_type: 'image/png',
                                        data: file.imageBase64
                                    }
                                });
                            }
                        });
                    }

                    content.push({ type: 'text', text: msg.content });
                    messages.push({ role: 'user', content });
                } else if (msg.role === 'assistant' && msg.model === 'claude' && msg.content.trim().length > 0) {
                    messages.push({ role: 'assistant', content: msg.content });
                }
            });

            const requestBody = {
                model: "claude-sonnet-4-20250514",
                max_tokens: 8192,
                temperature: 0.7,
                stream: true,
                messages: lcPrep(messages)
            };

            const response = await lcFetch(CLAUDE_ENDPOINT, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({ error: 'Unknown error' }));
                throw lcHttpError(response.status, errorData);
            }

            return await lcReadStream(response, onChunk);
        }

        // ══════════════════════ CHAT DISPLAY WITH CODE HIGHLIGHTING ══════════════════════
        function updateChatDisplay() {
            chatHistoryElement.innerHTML = "";
            chatHistory.forEach(message => {
                const messageDiv = document.createElement("div");
                messageDiv.classList.add(message.role === "user" ? "user-message" : "assistant-message");
                
                if (message.model) {
                    const badge = document.createElement("small");
                    badge.style.cssText = 'color: #0099ff; display: block; margin-bottom: 5px; font-size: 10px;';
                    badge.textContent = message.model === 'mistral' ? '🔮 Codestral' : '🤖 Claude';
                    messageDiv.appendChild(badge);
                }

                if (message.files && message.files.length > 0) {
                    const fileIndicator = document.createElement("small");
                    fileIndicator.style.cssText = 'color: #888; display: block; margin-bottom: 5px; font-size: 11px;';
                    fileIndicator.textContent = `📎 ${message.files.map(f => f.name).join(', ')}`;
                    messageDiv.appendChild(fileIndicator);
                }

                const codeBlockRegex = /```(?:html|javascript|js|css|python|java|cpp|c|json|xml|sql|php|ruby|go|rust|typescript|ts|markdown|md|yaml|yml)?\n?([\s\S]*?)\n?```/gi;
                let lastIndex = 0;
                let match;

                while ((match = codeBlockRegex.exec(message.content)) !== null) {
                    if (match.index > lastIndex) {
                        const text = message.content.substring(lastIndex, match.index);
                        if (text.trim()) {
                            messageDiv.appendChild(document.createTextNode(text));
                        }
                    }

                    const codeContent = match[1];
                    let language = 'plaintext';
                    
                    if (codeContent.includes('<!DOCTYPE') || codeContent.includes('<html')) language = 'html';
                    else if (codeContent.includes('function ') || codeContent.includes('const ') || codeContent.includes('let ')) language = 'javascript';
                    else if (codeContent.includes('def ')) language = 'python';
                    else if (codeContent.includes('import ')) language = 'java';
                    
                    const pre = document.createElement("pre");
                    const codeElement = document.createElement("code");
                    codeElement.className = `language-${language}`;
                    codeElement.textContent = codeContent.trim();
                    pre.appendChild(codeElement);
                    messageDiv.appendChild(pre);

                    lastIndex = codeBlockRegex.lastIndex;
                }

                if (lastIndex < message.content.length) {
                    const remainingText = message.content.substring(lastIndex);
                    if (remainingText.trim()) {
                        messageDiv.appendChild(document.createTextNode(remainingText));
                    }
                }

                chatHistoryElement.appendChild(messageDiv);
            });

            if (typeof Prism !== 'undefined') {
                try {
                    Prism.highlightAll();
                } catch (e) {
                    console.warn('Prism highlighting failed:', e);
                }
            }
            chatHistoryElement.scrollTop = chatHistoryElement.scrollHeight;
        }

        // ══════════════════════ FILE & TEXT OPERATIONS ══════════════════════
        function uploadChatFile() {
            const fileInput = document.getElementById("chatFileInput");
            const selectedFile = fileInput.files[0];
            if (!selectedFile) {
                alert("Please select a file to upload.");
                return;
            }
            const reader = new FileReader();
            reader.onload = function(event) {
                const content = event.target.result;
                chatHistory.push({
                    role: 'user',
                    content: `📄 File: ${selectedFile.name}\n\n${content}`,
                    model: currentModel
                });
                updateChatDisplay();
            };
            reader.readAsText(selectedFile);
        }

        function deleteUploadedFile() {
            uploadedFiles = [];
            updateFilePreview();
            alert("Uploaded files deleted.");
        }

        // ══════════════════════ HTML OPERATIONS ══════════════════════
        function runGeneratedHtml() {
            const htmlContent = document.getElementById('generatedHtml').value;
            if (!htmlContent) {
                alert("No HTML content to run!");
                return;
            }
            const newWindow = window.open();
            newWindow.document.open();
            newWindow.document.write(htmlContent);
            newWindow.document.close();
        }

        function downloadSnippet() {
            const assistantMessages = document.querySelectorAll(".assistant-message pre code");
            if (assistantMessages.length > 0) {
                const lastCodeBlock = assistantMessages[assistantMessages.length - 1];
                const snippet = lastCodeBlock.textContent;
                const blob = new Blob([snippet], { type: "text/html" });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "snippet.html";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            } else {
                alert("No code snippet to download!");
            }
        }

        function highlightLastAssistantResponse() {
            const assistantMessages = document.querySelectorAll(".assistant-message pre code");
            if (assistantMessages.length > 0) {
                const lastCodeBlock = assistantMessages[assistantMessages.length - 1];
                lastCodeBlock.classList.add("highlighted");
                const range = document.createRange();
                range.selectNodeContents(lastCodeBlock);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                try {
                    document.execCommand("copy");
                    alert("Code snippet copied to clipboard!");
                } catch (err) {
                    console.error("Error copying text: ", err);
                }
                setTimeout(() => {
                    lastCodeBlock.classList.remove("highlighted");
                    selection.removeAllRanges();
                }, 1000);
            } else {
                alert("No code snippet to highlight!");
            }
        }

        // ══════════════════════ STORAGE & PREFERENCES ══════════════════════
        function saveConversation() {
            lcAutosave();
            lcToast('Unterhaltung gespeichert');
        }

        function loadConversation() {
            const storedChatHistory = localStorage.getItem('chatHistory');
            if (storedChatHistory) {
                try {
                    chatHistory = JSON.parse(storedChatHistory);
                    updateChatDisplay();
                } catch (e) {
                    console.error('Error loading chat history:', e);
                }
            }
        }

        function clearChatHistory() {
            if (confirm('Clear all chat history?')) {
                chatHistory = [];
                uploadedFiles = [];
                isIncomplete = false;
                updateChatDisplay();
                updateFilePreview();
                updateButtonStates();
                localStorage.removeItem('chatHistory');
                alert("Chat history cleared!");
            }
        }

        // ══════════════════════ INITIALIZATION ══════════════════════
        document.addEventListener("DOMContentLoaded", function() {
            const savedModel = localStorage.getItem('selectedModel');
            if (savedModel && (savedModel === 'mistral' || savedModel === 'claude')) {
                currentModel = savedModel;
            } else {
                currentModel = 'mistral';
                localStorage.setItem('selectedModel', 'mistral');
            }
            document.getElementById('modelSelect').value = currentModel;

            const savedAutoContinue = localStorage.getItem('autoContinueEnabled');
            autoContinueEnabled = (savedAutoContinue !== 'false');
            const checkbox = document.getElementById('autoContinueCheckbox');
            if (checkbox) checkbox.checked = autoContinueEnabled;

            let textArea = document.getElementById("userPrompt");
            textArea.addEventListener("keydown", function(event) {
                if (event.key === "Enter" && !event.shiftKey) {
                    event.preventDefault();
                    fetchChatCompletion();
                }
            });

            loadConversation();
        });

        // ══════════════════════ NAVBAR ANIMATION ══════════════════════
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        const navbar = document.querySelector('.navbar');
        
        function resizeCanvas() {
            canvas.width = navbar.offsetWidth;
            canvas.height = navbar.offsetHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        const orbs = [
            { x: 0.2, y: 0.5, vx: 0.0003, vy: 0.0002, r: 60, color: [0, 255, 136] },
            { x: 0.8, y: 0.5, vx: -0.0002, vy: 0.0003, r: 80, color: [0, 150, 255] },
            { x: 0.5, y: 0.3, vx: 0.0002, vy: -0.0002, r: 50, color: [150, 100, 255] }
        ];
        
        let time = 0;
        
        function drawSmoothGradient() {
            ctx.fillStyle = 'rgba(26, 26, 46, 0.02)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            orbs.forEach((orb, idx) => {
                orb.x += orb.vx;
                orb.y += orb.vy;
                
                if (orb.x < 0) orb.x = 1;
                if (orb.x > 1) orb.x = 0;
                if (orb.y < 0) orb.y = 1;
                if (orb.y > 1) orb.y = 0;
                
                const screenX = orb.x * canvas.width;
                const screenY = orb.y * canvas.height;
                
                const gradient = ctx.createRadialGradient(screenX, screenY, 0, screenX, screenY, orb.r);
                const color = orb.color;
                const alpha = 0.15 + 0.05 * Math.sin(time * 0.002 + idx);
                
                gradient.addColorStop(0, `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${alpha})`);
                gradient.addColorStop(1, `rgba(${color[0]}, ${color[1]}, ${color[2]}, 0)`);
                
                ctx.fillStyle = gradient;
                ctx.fillRect(screenX - orb.r, screenY - orb.r, orb.r * 2, orb.r * 2);
            });
            
            time++;
        }
        
        function animate() {
            drawSmoothGradient();
            requestAnimationFrame(animate);
        }
        animate();

        // ══════════════════════ WELCOME MESSAGE ══════════════════════
        window.addEventListener('load', function() {
            const welcomeMsg = {
                role: 'assistant',
                content: `Hallo! Ich bin dein Coding-Assistent. Beschreibe, was du bauen willst, und ich liefere lauffähigen Code.

Tipp: Mit „▶ Testen“ siehst du HTML sofort in der Vorschau. Gute Prompts nennen Ziel, Zielgruppe und Grenzen.`
            };
            
            if (!chatHistory || chatHistory.length === 0) {
                chatHistory = [welcomeMsg];
                updateChatDisplay();
            }
        });
    </script>
