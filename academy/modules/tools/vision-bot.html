<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision ChatBot - Standalone</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f9fafb;
            color: #111827;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Header */
        .header {
            background-color: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 1rem 1.5rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }

        .header-content {
            max-width: 72rem;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-title i {
            color: #3b82f6;
            font-size: 1.5rem;
        }

        .header-title h1 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 80rem;
            margin: 0 auto;
            width: 100%;
            overflow: hidden;
            padding: 1rem;
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: white;
            border-radius: 0.75rem;
            border: 1px solid #e5e7eb;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* Chat Messages */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .message {
            margin-bottom: 1.5rem;
        }

        .message-content {
            max-width: 48rem;
        }

        .message.user .message-content {
            margin-left: auto;
        }

        .message.assistant .message-content {
            margin-right: auto;
        }

        .message-bubble {
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background-color: #3b82f6;
            color: white;
            margin-left: auto;
        }

        .message.assistant .message-bubble {
            background-color: #f3f4f6;
            color: #111827;
        }

        .message.loading .message-bubble {
            background-color: #f3f4f6;
            color: #6b7280;
            font-style: italic;
        }

        .message-image {
            max-width: 300px;
            max-height: 300px;
            border-radius: 0.5rem;
            margin-top: 0.5rem;
            border: 1px solid #e5e7eb;
        }

        /* Chat Input */
        .chat-input-container {
            padding: 1rem;
            border-top: 1px solid #e5e7eb;
            background-color: #f9fafb;
        }

        .chat-input-form {
            display: flex;
            gap: 0.75rem;
            align-items: flex-end;
            max-width: 64rem;
            margin: 0 auto;
        }

        .input-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .uploaded-images {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .uploaded-image {
            position: relative;
            width: 4rem;
            height: 4rem;
            border-radius: 0.5rem;
            overflow: hidden;
            border: 1px solid #e5e7eb;
        }

        .uploaded-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .remove-image {
            position: absolute;
            top: -0.25rem;
            right: -0.25rem;
            background-color: #ef4444;
            color: white;
            border-radius: 50%;
            width: 1.25rem;
            height: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            cursor: pointer;
            border: none;
        }

        .input-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .input-controls input[type="file"] {
            display: none;
        }

        .input-controls button {
            background-color: #6b7280;
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-controls button:hover {
            background-color: #4b5563;
        }

        .input-controls button i {
            font-size: 1.125rem;
        }

        .message-textarea {
            width: 100%;
            min-height: 2.5rem;
            max-height: 12.5rem;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            resize: none;
            overflow-y: auto;
            background-color: white;
            font-family: inherit;
        }

        .message-textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .submit-button {
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 50%;
            width: 3rem;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .submit-button:hover {
            background-color: #2563eb;
            transform: scale(1.05);
        }

        .submit-button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
            transform: scale(1);
        }

        .submit-button i {
            font-size: 1.25rem;
        }

        /* Loading Animation */
        .loading-dots {
            display: inline-flex;
            gap: 0.25rem;
        }

        .loading-dots span {
            width: 0.5rem;
            height: 0.5rem;
            background-color: currentColor;
            border-radius: 50%;
            animation: pulse 1.4s ease-in-out infinite both;
        }

        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes pulse {
            0%, 80%, 100% {
                transform: scale(0);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: white;
            padding: 1.5rem;
            border-radius: 1rem;
            max-width: 90vw;
            max-height: 90vh;
            overflow: auto;
            margin: 1rem;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .modal-title {
            font-size: 1.125rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #6b7280;
        }

        .modal-image {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }

        .modal-textarea {
            width: 100%;
            min-height: 4rem;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            font-family: inherit;
        }

        .modal-buttons {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }

        .modal-button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 500;
        }

        .modal-button.primary {
            background-color: #3b82f6;
            color: white;
        }

        .modal-button.secondary {
            background-color: #e5e7eb;
            color: #374151;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1001;
        }

        .toast {
            background-color: white;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-width: 24rem;
            animation: slide-in 0.3s ease-out;
        }

        .toast.error {
            border-color: #ef4444;
            background-color: #fef2f2;
        }

        .toast.success {
            border-color: #10b981;
            background-color: #f0fdf4;
        }

        @keyframes slide-in {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header {
                padding: 0.75rem 1rem;
            }

            .main-content {
                padding: 0.5rem;
            }

            .chat-input-form {
                flex-direction: column;
                align-items: stretch;
            }

            .input-controls {
                order: -1;
                justify-content: center;
            }

            .submit-button {
                align-self: flex-end;
                margin-top: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="header-title">
                <i class="ri-robot-line"></i>
                <h1>Vision Chatbot</h1>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="chat-container">
            <!-- Chat Messages -->
            <div class="chat-messages" id="chatMessages">
                <div class="message assistant">
                    <div class="message-content">
                        <div class="message-bubble">
                            Hallo! Ich bin dein Vision ChatBot mit GPT-4o mini. Ich kann dir bei der Analyse von Bildern helfen. Du kannst:
                            <br>• Bilder hochladen
                            <br>• Screenshots einfügen (mit Strg+V/Cmd+V)
                            <br>• Fragen zu den Bildern stellen
                            <br><br>Wie kann ich dir heute helfen?
                        </div>
                    </div>
                </div>
            </div>

            <!-- Chat Input -->
            <div class="chat-input-container">
                <form class="chat-input-form" id="chatForm">
                    <div class="input-section">
                        <div class="uploaded-images" id="uploadedImages"></div>
                        <div class="input-controls">
                            <button type="button" onclick="triggerFileUpload()" title="Bilder hochladen">
                                <i class="ri-image-add-line"></i>
                            </button>
                            <button type="button" onclick="showScreenshotHint()" title="Screenshot einfügen">
                                <i class="ri-screenshot-line"></i>
                            </button>
                            <input type="file" id="fileInput" multiple accept="image/*" onchange="handleFileUpload(event)">
                        </div>
                        <textarea 
                            id="messageInput" 
                            class="message-textarea" 
                            placeholder="Schreibe eine Nachricht..." 
                            rows="1"
                            onkeydown="handleKeyDown(event)"
                            oninput="autoResize(this)"
                        ></textarea>
                    </div>
                    <button type="submit" class="submit-button" id="submitButton">
                        <i class="ri-send-plane-fill"></i>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- Image Preview Modal -->
    <div id="imageModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Bild-Vorschau</h3>
                <button class="modal-close" onclick="closeImageModal()">&times;</button>
            </div>
            <img id="modalImage" class="modal-image" src="" alt="Vorschau">
            <textarea id="modalQuestion" class="modal-textarea" placeholder="Was möchtest du über dieses Bild wissen?">Was ist auf diesem Bild zu sehen?</textarea>
            <div class="modal-buttons">
                <button class="modal-button secondary" onclick="closeImageModal()">Abbrechen</button>
                <button class="modal-button primary" onclick="submitModalImage()">Senden</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // Global variables
        let messages = [];
        let uploadedImages = [];
        let isProcessing = false;

        // DOM elements
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const submitButton = document.getElementById('submitButton');
        const chatForm = document.getElementById('chatForm');
        const uploadedImagesContainer = document.getElementById('uploadedImages');
        const fileInput = document.getElementById('fileInput');
        const imageModal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');
        const modalQuestion = document.getElementById('modalQuestion');

        // Initialize welcome message
        messages.push({
            role: 'assistant',
            content: 'Hallo! Ich bin dein Vision ChatBot mit GPT-4o mini. Ich kann dir bei der Analyse von Bildern helfen. Du kannst:\n• Bilder hochladen\n• Screenshots einfügen (mit Strg+V/Cmd+V)\n• Fragen zu den Bildern stellen\n\nWie kann ich dir heute helfen?',
            timestamp: new Date()
        });

        // Auto-resize textarea
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
        }

        // Handle key down events
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                handleFormSubmit(event);
            }
        }

        // File upload functions
        function triggerFileUpload() {
            fileInput.click();
        }

        function handleFileUpload(event) {
            const files = Array.from(event.target.files);
            files.forEach(file => {
                if (file.size > 20 * 1024 * 1024) {
                    showToast('Datei zu groß. Bilder dürfen maximal 20MB groß sein.', 'error');
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    uploadedImages.push(e.target.result);
                    updateUploadedImagesDisplay();
                    showToast('Bild hinzugefügt', 'success');
                };
                reader.readAsDataURL(file);
            });
            event.target.value = ''; // Reset file input
        }

        // Screenshot functionality
        function showScreenshotHint() {
            showToast('Kopiere einen Screenshot in die Zwischenablage und füge ihn mit Strg+V (oder Cmd+V) ein.', 'info');
        }

        // Paste event listener for screenshots
        document.addEventListener('paste', function(e) {
            const items = e.clipboardData?.items;
            if (!items) return;

            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    const blob = items[i].getAsFile();
                    if (!blob) continue;

                    if (blob.size > 20 * 1024 * 1024) {
                        showToast('Datei zu groß. Bilder dürfen maximal 20MB groß sein.', 'error');
                        continue;
                    }

                    const reader = new FileReader();
                    reader.onload = (event) => {
                        uploadedImages.push(event.target.result);
                        updateUploadedImagesDisplay();
                        showToast('Screenshot hinzugefügt', 'success');
                    };
                    reader.readAsDataURL(blob);
                }
            }
        });

        // Update uploaded images display
        function updateUploadedImagesDisplay() {
            uploadedImagesContainer.innerHTML = '';
            uploadedImages.forEach((imageData, index) => {
                const div = document.createElement('div');
                div.className = 'uploaded-image';
                div.innerHTML = `
                    <img src="${imageData}" alt="Uploaded image">
                    <button class="remove-image" onclick="removeUploadedImage(${index})" type="button">
                        <i class="ri-close-line"></i>
                    </button>
                `;
                uploadedImagesContainer.appendChild(div);
            });
        }

        // Remove uploaded image
        function removeUploadedImage(index) {
            uploadedImages.splice(index, 1);
            updateUploadedImagesDisplay();
        }

        // Form submission
        function handleFormSubmit(event) {
            event.preventDefault();
            
            const messageText = messageInput.value.trim();
            if (!messageText && uploadedImages.length === 0) return;

            if (isProcessing) return;

            // Handle single image with modal
            if (uploadedImages.length === 1 && !messageText) {
                showImageModal(uploadedImages[0]);
                return;
            }

            sendMessage(messageText, uploadedImages);
        }

        // Show image modal
        function showImageModal(imageData) {
            modalImage.src = imageData;
            modalQuestion.value = 'Was ist auf diesem Bild zu sehen?';
            imageModal.style.display = 'flex';
        }

        // Close image modal
        function closeImageModal() {
            imageModal.style.display = 'none';
        }

        // Submit image from modal
        function submitModalImage() {
            const question = modalQuestion.value.trim();
            if (!question) return;

            const imageData = modalImage.src;
            closeImageModal();
            sendMessage(question, [imageData]);
        }

        // Send message to API
        async function sendMessage(messageText, images = []) {
            isProcessing = true;
            updateSubmitButton();

            // Add user message
            const userMessage = {
                role: 'user',
                content: messageText || 'Analysiere dieses Bild',
                timestamp: new Date(),
                images: images.length > 0 ? [...images] : undefined
            };
            
            messages.push(userMessage);
            addMessageToChat(userMessage);

            // Add loading message
            const loadingMessage = {
                role: 'loading',
                content: 'Denke nach...',
                timestamp: new Date()
            };
            messages.push(loadingMessage);
            addMessageToChat(loadingMessage);

            // Clear input and images
            messageInput.value = '';
            uploadedImages = [];
            updateUploadedImagesDisplay();
            autoResize(messageInput);

            try {
                // Prepare request data
                const requestData = {
                    message: messageText || 'Was ist auf diesem Bild zu sehen?'
                };

                if (images.length === 1) {
                    requestData.imageData = images[0];
                } else if (images.length > 1) {
                    requestData.imageDataArray = images;
                }

                // This is where you would make the API call to your backend
                // For the standalone version, you need to replace this with your actual API endpoint
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                // Remove loading message
                messages = messages.filter(msg => msg.role !== 'loading');
                
                // Add response
                const responseMessage = {
                    role: 'assistant',
                    content: data.response,
                    timestamp: new Date()
                };
                messages.push(responseMessage);
                
                // Re-render all messages
                renderMessages();

            } catch (error) {
                console.error('Error:', error);
                
                // Remove loading message
                messages = messages.filter(msg => msg.role !== 'loading');
                
                // Add error message
                const errorMessage = {
                    role: 'assistant',
                    content: 'Entschuldigung, aber ich konnte deine Anfrage nicht verarbeiten. Bitte versuche es später erneut.',
                    timestamp: new Date(),
                    isError: true
                };
                messages.push(errorMessage);
                
                // Re-render all messages
                renderMessages();
                
                showToast('Fehler beim Senden der Nachricht', 'error');
            } finally {
                isProcessing = false;
                updateSubmitButton();
            }
        }

        // Add message to chat
        function addMessageToChat(message) {
            renderMessages();
        }

        // Render all messages
        function renderMessages() {
            chatMessages.innerHTML = '';
            messages.forEach(message => {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${message.role}`;
                
                let content = message.content;
                if (message.role === 'loading') {
                    content = `<div class="loading-dots"><span></span><span></span><span></span></div> ${content}`;
                }

                let imagesHtml = '';
                if (message.images && message.images.length > 0) {
                    imagesHtml = message.images.map(img => 
                        `<img class="message-image" src="${img}" alt="Hochgeladenes Bild">`
                    ).join('');
                }

                messageDiv.innerHTML = `
                    <div class="message-content">
                        <div class="message-bubble">
                            ${content.replace(/\n/g, '<br>')}
                            ${imagesHtml}
                        </div>
                    </div>
                `;
                
                chatMessages.appendChild(messageDiv);
            });
            
            // Scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Update submit button state
        function updateSubmitButton() {
            const hasContent = messageInput.value.trim() || uploadedImages.length > 0;
            submitButton.disabled = !hasContent || isProcessing;
        }

        // Toast notifications
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <div style="font-weight: 500; margin-bottom: 0.25rem;">${type === 'error' ? 'Fehler' : type === 'success' ? 'Erfolg' : 'Info'}</div>
                <div style="font-size: 0.875rem; color: #6b7280;">${message}</div>
            `;
            
            const container = document.getElementById('toastContainer');
            container.appendChild(toast);
            
            // Auto remove after 5 seconds
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.parentNode.removeChild(toast);
                }
            }, 5000);
        }

        // Event listeners
        chatForm.addEventListener('submit', handleFormSubmit);
        messageInput.addEventListener('input', updateSubmitButton);

        // Initialize
        renderMessages();
        updateSubmitButton();

        // Focus on input
        messageInput.focus();
    </script>
</body>
</html>
