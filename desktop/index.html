<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ORBITRON VIBE CODING — Redline Desktop</title>
<meta name="description" content="Redline Desktop: Explorer, Fenster, Chatrooms und alle IDEs des Vibe-Coding-Kurses in einer Oberfläche.">
<meta name="theme-color" content="#160608">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root {
  --bg: #160608; --bg-deep: #090304;
  --panel: #1c080d; --panel-soft: rgba(47, 13, 21, .78);
  --line: rgba(251, 113, 133, .22); --line-strong: rgba(251, 113, 133, .64);
  --accent: #fb7185; --accent-hot: #ef4444; --accent-deep: #991b1b; --gold: #fbbf24; --ok: #34d399;
  --text: #fff1f2; --muted: #c597a1; --dim: #7c4b57;
  --bar: 48px;
  --font-display: 'Segoe UI Semibold', 'Segoe UI', system-ui, sans-serif;
  --sab: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { overflow: hidden; color: var(--text); background: var(--bg-deep); font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }

.shell { position: relative; width: 100vw; height: 100dvh; overflow: hidden;
  background: radial-gradient(circle at 66% 13%, rgba(239, 68, 68, .2), transparent 31%), radial-gradient(circle at 9% 88%, rgba(153, 27, 27, .25), transparent 38%), linear-gradient(135deg, var(--bg) 0%, #260b12 50%, var(--bg-deep) 100%); }
.shell::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .28; background-image: linear-gradient(rgba(251, 113, 133, .08) 1px, transparent 1px), linear-gradient(90deg, rgba(251, 113, 133, .08) 1px, transparent 1px); background-size: 48px 48px; mask-image: linear-gradient(to bottom, black, transparent 90%); }
.canvas { position: absolute; inset: 0 0 calc(var(--bar) + var(--sab)); overflow: hidden; }
#fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.brand { position: absolute; top: 22px; left: 30px; z-index: 2; pointer-events: none; text-shadow: 0 0 24px rgba(239, 68, 68, .42); }
.brand h1 { margin: 0; font: 800 clamp(18px, 2vw, 28px)/1 var(--font-display); letter-spacing: .14em; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 7px 0 0; color: var(--muted); font-size: 10px; letter-spacing: .22em; text-transform: uppercase; }

.shortcuts { position: absolute; top: 96px; right: 28px; bottom: 12px; left: 28px; z-index: 2; display: grid; align-content: start; grid-auto-rows: min-content; gap: 12px; overflow-y: auto; padding: 2px 2px 18px; scrollbar-width: thin; }
.sec-title { display: flex; align-items: center; gap: 8px; margin: 3px 0 7px; padding: 5px 8px; border-left: 2px solid var(--accent); color: var(--accent); background: rgba(47, 13, 21, .48); font: 700 10px/1.2 var(--font-display); letter-spacing: .12em; text-transform: uppercase; }
.sec-title::after { content: ""; height: 1px; flex: 1; background: linear-gradient(90deg, rgba(251, 113, 133, .34), transparent); }
.sec-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 9px; }
.dicon { display: flex; flex-direction: column; align-items: center; width: 100%; min-height: 96px; padding: 7px 5px; border: 1px solid rgba(251, 113, 133, .12); border-radius: 11px; background: rgba(26, 5, 10, .3); text-align: center; text-decoration: none; color: var(--text); transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), background .25s, border-color .25s; }
.dicon:hover, .dicon:focus-visible { border-color: var(--line-strong); background: rgba(127, 29, 45, .4); transform: translateY(-3px) scale(1.02); }
.dicon .ic { display: grid; place-items: center; width: 54px; height: 54px; margin-bottom: 6px; border: 1px solid rgba(251, 113, 133, .62); border-radius: 15px; background: linear-gradient(145deg, #be123c, #7f1d1d); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .15), 0 0 20px rgba(239, 68, 68, .25); font-size: 24px; }
.dicon span { font-size: 11px; font-weight: 600; line-height: 1.2; word-break: break-word; }

/* Fenster */
#windows { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
.win { position: absolute; display: flex; flex-direction: column; min-width: 340px; min-height: 240px; overflow: hidden; pointer-events: auto; border: 1px solid var(--line-strong); border-radius: 13px; background: #1c080d; box-shadow: 0 24px 70px rgba(0, 0, 0, .52), 0 0 35px rgba(239, 68, 68, .14); }
.win.active { border-color: rgba(254, 205, 211, .86); box-shadow: 0 26px 76px rgba(0, 0, 0, .58), 0 0 38px rgba(239, 68, 68, .25); }
.win.max { top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; border-radius: 0; }
.win.min { display: none; }
.win.anim { transition: left .16s, top .16s, width .16s, height .16s; }
.tb { display: flex; align-items: center; flex: 0 0 auto; gap: 10px; height: 42px; padding: 0 8px 0 13px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, rgba(58, 17, 27, .98), rgba(29, 8, 14, .98)); cursor: grab; user-select: none; touch-action: none; }
.tb:active { cursor: grabbing; }
.tb .wi { color: var(--accent); font-size: 14px; }
.tb .wt { min-width: 0; max-width: 28%; overflow: hidden; font: 700 11px var(--font-display); letter-spacing: .08em; text-overflow: ellipsis; white-space: nowrap; }
.addr { display: flex; align-items: center; flex: 1 1 200px; min-width: 0; height: 26px; gap: 8px; padding: 0 9px; overflow: hidden; border: 1px solid var(--line); border-radius: 7px; color: var(--muted); background: rgba(9, 3, 5, .64); font: 10px 'Courier New', monospace; cursor: default; }
.addr input { width: 100%; min-width: 0; padding: 0; border: 0; outline: 0; color: inherit; background: transparent; text-overflow: ellipsis; font: inherit; }
.wc { display: flex; align-items: center; gap: 3px; margin-left: auto; }
.wb { display: grid; place-items: center; width: 30px; height: 28px; border: 1px solid transparent; border-radius: 7px; color: var(--muted); background: transparent; }
.wb:hover, .wb:focus-visible { border-color: var(--line-strong); color: var(--accent); background: rgba(127, 29, 45, .38); }
.wb.x:hover { color: #fff; background: rgba(220, 38, 38, .72); }
.wbody { position: relative; min-height: 0; flex: 1; overflow: hidden; background: #fff; }
.wbody.dark { background: transparent; }
.wbody iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 10px; color: var(--muted); background: var(--panel); text-align: center; padding: 20px; }
.loading i { font-size: 22px; color: var(--accent); }
.loading a { color: var(--gold); }
.dragging iframe, .resizing iframe { pointer-events: none !important; }
.rh { position: absolute; z-index: 5; }
.rh[data-d="n"] { top: -4px; right: 12px; left: 12px; height: 9px; cursor: n-resize; }
.rh[data-d="s"] { right: 12px; bottom: -4px; left: 12px; height: 9px; cursor: s-resize; }
.rh[data-d="e"] { top: 12px; right: -4px; bottom: 12px; width: 9px; cursor: e-resize; }
.rh[data-d="w"] { top: 12px; bottom: 12px; left: -4px; width: 9px; cursor: w-resize; }
.rh[data-d="ne"] { top: -4px; right: -4px; width: 20px; height: 20px; cursor: ne-resize; }
.rh[data-d="nw"] { top: -4px; left: -4px; width: 20px; height: 20px; cursor: nw-resize; }
.rh[data-d="se"] { right: -4px; bottom: -4px; width: 20px; height: 20px; cursor: se-resize; }
.rh[data-d="sw"] { bottom: -4px; left: -4px; width: 20px; height: 20px; cursor: sw-resize; }
.win.max .rh { display: none; }
#snap { position: absolute; z-index: 9; display: none; border: 2px dashed var(--accent); border-radius: 12px; background: rgba(251, 113, 133, .12); pointer-events: none; }

/* Taskleiste */
.bar { position: absolute; right: 0; bottom: 0; left: 0; z-index: 220; display: flex; align-items: center; gap: 7px; height: calc(var(--bar) + var(--sab)); padding: 0 12px var(--sab); border-top: 1px solid var(--line); background: rgba(18, 4, 8, .94); backdrop-filter: blur(16px); }
.bbtn { flex: 0 0 34px; display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid transparent; border-radius: 7px; color: var(--muted); background: transparent; font-size: 13px; }
.bbtn:hover, .bbtn[aria-pressed="true"], .bbtn[aria-expanded="true"] { border-color: var(--line-strong); color: var(--accent); background: rgba(127, 29, 45, .38); }
.bbtn.start { border-color: var(--line); color: #fff; background: linear-gradient(145deg, #be123c, #7f1d1d); }
.search { position: relative; flex: 0 1 240px; min-width: 120px; }
.search i { position: absolute; top: 50%; left: 10px; transform: translateY(-50%); color: var(--dim); font-size: 12px; pointer-events: none; }
.search input { width: 100%; height: 34px; padding: 0 10px 0 30px; border: 1px solid var(--line); border-radius: 8px; background: rgba(9, 3, 5, .64); outline: 0; font-size: 13px; }
.search input:focus { border-color: var(--line-strong); }
.tasks { display: flex; flex: 1; min-width: 0; gap: 5px; overflow-x: auto; scrollbar-width: none; }
.tasks::-webkit-scrollbar { display: none; }
.task { flex: 0 1 170px; display: flex; align-items: center; gap: 7px; min-width: 40px; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: rgba(47, 13, 21, .5); font-size: 12px; white-space: nowrap; }
.task span { overflow: hidden; text-overflow: ellipsis; }
.task i { color: var(--accent); }
.task.active { border-color: var(--line-strong); background: rgba(127, 29, 45, .55); box-shadow: inset 0 -2px 0 var(--accent); }
.task.min { opacity: .6; }
.clock { display: grid; justify-items: end; padding: 0 4px 0 8px; line-height: 1.2; cursor: default; }
.clock b { font-size: 12px; letter-spacing: .05em; }
.clock small { color: var(--muted); font-size: 10px; }

/* Menues */
.pop { position: absolute; z-index: 300; border: 1px solid var(--line-strong); border-radius: 12px; background: rgba(24, 6, 11, .98); box-shadow: 0 18px 60px rgba(0, 0, 0, .6); }
#start { left: 10px; bottom: calc(var(--bar) + var(--sab) + 8px); width: min(420px, calc(100vw - 20px)); max-height: min(560px, calc(100dvh - 90px)); display: flex; flex-direction: column; overflow: hidden; }
#start .sh { padding: 12px 14px 4px; color: var(--muted); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
#start .sg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 6px 10px 10px; overflow: auto; }
#start .si { display: grid; justify-items: center; gap: 5px; padding: 9px 4px; border: 1px solid transparent; border-radius: 9px; background: transparent; font-size: 11px; text-align: center; }
#start .si:hover, #start .si:focus-visible { border-color: var(--line-strong); background: rgba(127, 29, 45, .35); }
#start .si .ic { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(145deg, #be123c, #7f1d1d); }
#start .sa { display: grid; gap: 2px; padding: 8px 10px 10px; border-top: 1px solid var(--line); }
#start .sa button { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; }
#start .sa button:hover { background: rgba(127, 29, 45, .35); }
#start .sa i { width: 18px; color: var(--accent); text-align: center; }
#results { left: 56px; bottom: calc(var(--bar) + var(--sab) + 8px); width: min(460px, calc(100vw - 70px)); max-height: 56dvh; overflow: auto; padding: 6px; }
.res { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 1px solid transparent; border-radius: 8px; background: transparent; text-align: left; }
.res[aria-selected="true"], .res:hover { border-color: var(--line-strong); background: rgba(127, 29, 45, .35); }
.res .ic { display: grid; place-items: center; flex: 0 0 30px; width: 30px; height: 30px; border-radius: 8px; background: rgba(127, 29, 45, .55); color: var(--accent); }
.res b { display: block; font-size: 13px; }
.res small { color: var(--muted); font-size: 11px; }
#ctx { min-width: 200px; padding: 5px; }
#ctx button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 7px; background: transparent; text-align: left; font-size: 13px; }
#ctx button:hover, #ctx button:focus-visible { background: rgba(127, 29, 45, .45); }
#ctx i { width: 16px; color: var(--accent); text-align: center; }
#ctx hr { margin: 4px 0; border: 0; border-top: 1px solid var(--line); }
#toast { position: absolute; left: 50%; bottom: calc(var(--bar) + var(--sab) + 14px); z-index: 400; transform: translateX(-50%); max-width: 90vw; padding: 9px 14px; border: 1px solid var(--line-strong); border-radius: 10px; background: rgba(24, 6, 11, .98); font-size: 13px; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); }

/* Explorer */
.ex { display: grid; grid-template-columns: 220px minmax(0, 1fr); height: 100%; min-height: 0; }
.ex-side { min-width: 0; overflow-y: auto; padding: 10px 8px; border-right: 1px solid var(--line); background: rgba(24, 6, 11, .86); scrollbar-width: thin; }
.ex-side h3 { margin: 12px 8px 5px; color: var(--muted); font-size: 9px; letter-spacing: .16em; text-transform: uppercase; }
.ex-side h3:first-child { margin-top: 2px; }
.fb { display: flex; align-items: center; width: 100%; gap: 8px; margin-bottom: 2px; padding: 7px 8px; border: 1px solid transparent; border-radius: 7px; background: transparent; text-align: left; font-size: 12px; }
.fb i { flex: 0 0 16px; color: var(--accent); text-align: center; }
.fb span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fb em { color: var(--dim); font-size: 10px; font-style: normal; }
.fb:hover { background: rgba(127, 29, 45, .25); }
.fb[aria-current="true"] { border-color: var(--line); background: rgba(127, 29, 45, .45); }
.ex-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.ex-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); background: rgba(47, 13, 21, .48); }
.ex-bar .nb { display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--muted); }
.ex-bar .nb:hover:not(:disabled), .ex-bar .nb[aria-pressed="true"] { border-color: var(--line-strong); color: var(--accent); background: rgba(127, 29, 45, .38); }
.ex-bar .nb:disabled { opacity: .35; cursor: default; }
.crumbs { display: flex; flex: 1 1 160px; align-items: center; gap: 4px; min-width: 120px; height: 30px; padding: 0 10px; overflow: hidden; border: 1px solid var(--line); border-radius: 7px; background: rgba(9, 3, 5, .6); font: 600 11px var(--font-display); white-space: nowrap; }
.crumbs button { padding: 2px 4px; border: 0; border-radius: 4px; background: transparent; color: var(--accent); font: inherit; }
.crumbs button:hover { background: rgba(127, 29, 45, .4); }
.crumbs span { color: var(--dim); }
.ex-bar .q { flex: 0 1 180px; min-width: 110px; height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; background: rgba(9, 3, 5, .6); outline: 0; font-size: 12px; }
.ex-bar select { height: 30px; padding: 0 6px; border: 1px solid var(--line); border-radius: 7px; background: rgba(9, 3, 5, .8); font-size: 12px; }
.ex-list { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; outline: none; scrollbar-width: thin; }
.ex-list.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); align-content: start; gap: 9px; }
.ex-list.list { display: grid; align-content: start; gap: 4px; }
.card { position: relative; display: flex; flex-direction: column; min-height: 128px; padding: 11px; border: 1px solid var(--line); border-radius: 10px; background: rgba(47, 13, 21, .36); text-align: left; transition: transform .2s, border-color .2s, background .2s; }
.card:hover { border-color: var(--line-strong); background: rgba(127, 29, 45, .32); transform: translateY(-2px); }
.card.sel, .row.sel { border-color: var(--gold); background: rgba(127, 29, 45, .5); }
.card.hasth { padding: 0; overflow: hidden; }
.card.hasth .cn, .card.hasth .cm, .card.hasth .tags { margin-left: 11px; margin-right: 11px; }
.card.hasth .tags { padding-bottom: 10px; }
.card .th { aspect-ratio: 16 / 9; overflow: hidden; background: #0b0b12; border-bottom: 1px solid var(--line); }
.card .th img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.card.hasth .star { background: rgba(9, 3, 5, .72); }
.row .th { width: 56px; height: 32px; overflow: hidden; border-radius: 5px; background: #0b0b12; }
.row .th img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.card .ci { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 9px; color: var(--accent); background: rgba(127, 29, 45, .45); font-size: 18px; }
.card .cn { margin-top: 9px; padding-right: 22px; font-size: 12px; font-weight: 600; line-height: 1.25; }
.card .cm { margin-top: 4px; color: var(--muted); font-size: 10px; line-height: 1.35; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; padding-top: 7px; }
.tag { padding: 1px 6px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 9px; }
.tag.ok { color: var(--ok); border-color: rgba(52, 211, 153, .4); }
.tag.warn { color: var(--gold); border-color: rgba(251, 191, 36, .4); }
.star { position: absolute; top: 6px; right: 6px; display: grid; place-items: center; width: 26px; height: 26px; border: 0; border-radius: 6px; background: transparent; color: var(--dim); }
.star:hover { color: var(--gold); background: rgba(127, 29, 45, .4); }
.star[aria-pressed="true"] { color: var(--gold); }
.row { position: relative; display: grid; grid-template-columns: 56px minmax(0, 1.2fr) minmax(0, 2fr) 120px 30px; align-items: center; gap: 10px; padding: 6px 10px; border: 1px solid transparent; border-radius: 8px; text-align: left; }
.row:hover { background: rgba(127, 29, 45, .25); }
.row .ci { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; color: var(--accent); background: rgba(127, 29, 45, .45); }
.row .rn { overflow: hidden; font-size: 12px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
.row .rd, .row .rc { overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
.row .star { position: static; }
.ex-status { display: flex; align-items: center; gap: 12px; min-height: 34px; padding: 6px 12px; border-top: 1px solid var(--line); background: rgba(24, 6, 11, .86); color: var(--muted); font-size: 11px; }
.ex-status .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { display: grid; place-items: center; align-content: center; gap: 8px; min-height: 200px; color: var(--muted); text-align: center; grid-column: 1 / -1; }
.empty i { font-size: 26px; color: var(--dim); }
.skel { grid-column: 1 / -1; padding: 30px; color: var(--muted); text-align: center; }

@media (max-width: 768px) {
  .brand { position: relative; top: auto; left: auto; padding: 8px 4px 4px; }
  .canvas { overflow-y: auto; padding: 12px; }
  .shortcuts { position: relative; top: auto; right: auto; bottom: auto; left: auto; padding: 0 0 16px; }
  .sec-row { grid-template-columns: repeat(4, minmax(60px, 1fr)); gap: 6px; }
  .dicon { min-height: 80px; } .dicon .ic { width: 40px; height: 40px; font-size: 18px; }
  #windows { position: fixed; inset: 0 0 calc(var(--bar) + var(--sab)); }
  .win { position: absolute !important; inset: 0 !important; width: 100% !important; height: 100% !important; min-width: 0; min-height: 0; border-radius: 0; }
  .win:not(.active) { display: none; }
  .addr, .wb.hide-m, .rh { display: none; }
  .tb { cursor: default; }
  .ex { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
  .ex-side { display: flex; gap: 5px; overflow-x: auto; padding: 8px; border-right: 0; border-bottom: 1px solid var(--line); }
  .ex-side h3 { display: none; } .fb { width: auto; min-width: max-content; margin: 0; }
  .ex-list.grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .row { grid-template-columns: 56px minmax(0, 1fr) 30px; } .row .rd, .row .rc { display: none; }
  .search { flex: 1 1 100px; } .clock small { display: none; } .task span { display: none; } .task { flex: 0 0 40px; justify-content: center; padding: 0; }
  .bbtn.hide-m { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="shell" id="shell">
  <main class="canvas" id="canvas">
    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="brand"><h1>ORBITRON <span>VIBE CODING</span></h1><p>Redline Desktop // Explorer · Fenster · Chatroom</p></div>
    <nav class="shortcuts" id="shortcuts" aria-label="Desktop-Verknüpfungen"></nav>
    <div id="windows"></div>
    <div id="snap"></div>
  </main>
  <div class="pop" id="start" role="dialog" aria-label="Startmenü" hidden></div>
  <div class="pop" id="results" role="listbox" aria-label="Suchergebnisse" hidden></div>
  <div class="pop" id="ctx" role="menu" hidden></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <footer class="bar">
    <button class="bbtn start" id="startBtn" type="button" title="Start (Strg+Leertaste)" aria-label="Startmenü" aria-expanded="false"><i class="fa-solid fa-atom"></i></button>

    sel = hits.length ? 0 : -1; box.innerHTML = '';
    if (!hits.length) { var e = document.createElement('div'); e.className = 'res'; e.textContent = 'Keine Treffer. Im Explorer weitersuchen: Enter.'; box.appendChild(e); hits = []; }
    hits.forEach(function (it, i) { var b = document.createElement('button'); b.type = 'button'; b.className = 'res'; b.setAttribute('role', 'option'); b.setAttribute('aria-selected', i === sel ? 'true' : 'false'); b.innerHTML = '<div class="ic"><i class="fa-solid ' + esc(it.icon) + '"></i></div><div><b></b><small></small></div>'; b.querySelector('b').textContent = it.name; b.querySelector('small').textContent = (it.groupName || '') + (it.desc ? ' · ' + it.desc : ''); b.addEventListener('click', function () { choose(it); }); b.addEventListener('mouseenter', function () { sel = i; markSel(); }); box.appendChild(b); });
    box.hidden = false;
  }
  function markSel() { $('results').querySelectorAll('.res').forEach(function (b, i) { b.setAttribute('aria-selected', i === sel ? 'true' : 'false'); }); }
  function choose(it) { $('results').hidden = true; $('q').value = ''; $('q').blur(); openItem(it); }
  $('q').addEventListener('input', runSearch);
  $('q').addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (hits.length) { sel = (sel + 1) % hits.length; markSel(); } }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (hits.length) { sel = (sel - 1 + hits.length) % hits.length; markSel(); } }
    else if (e.key === 'Enter') { e.preventDefault(); if (hits[sel]) choose(hits[sel]); else if ($('q').value.trim()) { var qq = $('q').value.trim(); $('q').value = ''; hidePops(); openExplorer(); setTimeout(function () { EX.q = qq; refreshExplorer(); var i = EX.el && EX.el.querySelector('#exQ'); if (i) i.value = qq; }, 60); } }
    else if (e.key === 'Escape') { $('q').value = ''; $('results').hidden = true; $('q').blur(); }
  });
  $('q').addEventListener('focus', runSearch);

  /* ================= Matrix-Effekt ================= */
  var fxOn = store.get('fx', true), cv = $('fx'), cx = cv.getContext('2d'), drops = [], fxTimer = null, last = 0;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; if (reduce) fxOn = false;
  var FS = 14, CH = '01アイウエオカキクケコ';
  function fxResize() { var r = cv.parentElement.getBoundingClientRect(); cv.width = Math.max(1, r.width); cv.height = Math.max(1, r.height); var n = Math.ceil(cv.width / FS); while (drops.length < n) drops.push(Math.random() * -40); drops.length = n; cx.fillStyle = '#090304'; cx.fillRect(0, 0, cv.width, cv.height); }
  function fxFrame(t) {
    fxTimer = requestAnimationFrame(fxFrame);
    if (t - last < 45) return; last = t;
    cx.fillStyle = 'rgba(9, 3, 5, 0.06)'; cx.fillRect(0, 0, cv.width, cv.height); cx.fillStyle = 'rgba(251, 113, 133, 0.5)'; cx.font = FS + 'px monospace';
    for (var i = 0; i < drops.length; i++) { cx.fillText(CH[Math.floor(Math.random() * CH.length)], i * FS, drops[i] * FS); if (drops[i] * FS > cv.height && Math.random() > 0.975) drops[i] = 0; drops[i]++; }
  }
  function fxCheck() {
    var covered = Object.keys(wins).some(function (k) { return wins[k].max && !wins[k].min; }) || mobile();
    var run = fxOn && !document.hidden && !covered;
    if (run && !fxTimer) { fxResize(); fxTimer = requestAnimationFrame(fxFrame); }
    else if (!run && fxTimer) { cancelAnimationFrame(fxTimer); fxTimer = null; if (!fxOn) { cx.clearRect(0, 0, cv.width, cv.height); } }
  }
  document.addEventListener('visibilitychange', fxCheck);
  window.addEventListener('resize', function () { if (fxTimer) fxResize(); Object.keys(wins).forEach(function (k) { if (!wins[k].max) clamp(wins[k]); }); });

  /* ================= Start ================= */
  function tick() { var n = new Date(); $('tm').textContent = n.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }); $('dt').textContent = n.toLocaleDateString('de-DE'); }
  tick(); setInterval(tick, 20000);
  $('startBtn').addEventListener('click', toggleStart);
  $('exBtn').addEventListener('click', openExplorer);
  $('chatBtn').addEventListener('click', function () { openItem(byKey['https://genitus-chatroom.replit.app/']); });
  $('showDesk').addEventListener('click', showDesktop);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { hidePops(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('q').focus(); $('q').select(); }
    else if (e.ctrlKey && e.code === 'Space') { e.preventDefault(); toggleStart(); }
  });
  renderShortcuts(); renderStart(); fxCheck();
  var params = new URLSearchParams(location.search);
  loadManifests().then(function () { renderShortcuts(); renderStart(); refreshExplorer(); if (EX.el) refreshExplorer(); }).then(function () {
    var o = params.get('open'); if (o === 'explorer') openExplorer(); else if (o && byKey[o]) openItem(byKey[o]);
  });
  if (params.get('open') === 'explorer') openExplorer();
  window.__desktop = { openExplorer: openExplorer, openItem: openItem, ALL: ALL, wins: wins, snapTo: snapTo, EX: EX };
})();
