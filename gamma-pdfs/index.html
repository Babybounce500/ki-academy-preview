*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 48px}

.controls{display:grid;gap:12px;grid-template-columns:1fr;margin-bottom:12px}

label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.count{color:var(--muted);font-size:.9rem;margin:8px 0 16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));list-style:none;margin:0;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:1.05rem;line-height:1.3;margin:0;overflow-wrap:anywhere}
.card p{margin:0;color:var(--muted);font-size:.93rem}
.cat{font-size:.75rem;color:var(--cyan);text-transform:uppercase;letter-spacing:.04em}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:.78rem}
.meta span{border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
.badge{border-radius:999px;padding:2px 9px;font-size:.78rem;font-weight:600}
.b-stand{background:rgba(251,191,36,.15);color:var(--gold);border:1px solid var(--gold)}
.b-rev{background:rgba(236,72,153,.13);color:var(--pink);border:1px solid var(--pink)}
.tags{font-size:.78rem;color:var(--muted)}
.actions{display:flex;gap:10px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.btn{display:inline-block;padding:9px 16px;border-radius:10px;text-decoration:none;font-weight:600;font-size:.92rem;border:1px solid var(--cyan);color:var(--cyan)}
.btn.primary{background:var(--cyan);color:#04141a}
@media (prefers-color-scheme:light){.btn.primary{color:#fff}}
.btn:hover{filter:brightness(1.12)}
.empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
footer{margin-top:32px;color:var(--muted);font-size:.85rem}
</style>
</head>

<script>
(function(){
  var items=[];
  try{items=JSON.parse(document.getElementById('data').textContent)}catch(e){items=[]}
  var q=document.getElementById('q'),cat=document.getElementById('cat'),lvl=document.getElementById('lvl'),grid=document.getElementById('grid'),count=document.getElementById('count');
  var cats={};items.forEach(function(i){cats[i.category]=i.categoryLabel});
  Object.keys(cats).sort(function(a,b){return cats[a].localeCompare(cats[b],'de')}).forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=cats[k];cat.appendChild(o)});
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  function url(p){return p.split('/').map(encodeURIComponent).join('/')}
  function render(){
    var t=q.value.trim().toLowerCase(),c=cat.value,l=lvl.value;
    var res=items.filter(function(i){
      if(c&&i.category!==c)return false;
      if(l&&i.level!==l)return false;
      if(!t)return true;
      return (i.title+' '+i.description+' '+i.tags.join(' ')+' '+i.categoryLabel).toLowerCase().indexOf(t)>-1;
    });
    grid.textContent='';
    count.textContent=res.length+' von '+items.length+' Folien';
    if(!res.length){var li=el('li','empty','Keine Treffer. Passe Suche oder Filter an.');li.style.gridColumn='1/-1';grid.appendChild(li);return}
    res.forEach(function(i){
      var li=el('li','card');
      li.appendChild(el('div','cat',i.categoryLabel));
      li.appendChild(el('h2','',i.title));
      li.appendChild(el('p','',i.description));
      var m=el('div','meta');
      [i.pages+' Seiten',i.sizeMB.toFixed(1).replace('.',',')+' MB',i.language.toUpperCase(),i.level].forEach(function(x){m.appendChild(el('span','',x))});
      li.appendChild(m);
      if(i.standHinweis||i.review){
        var b=el('div','meta');
        if(i.standHinweis){var s=el('span','badge b-stand','Stand 2023/24');s.title=i.standHinweis;b.appendChild(s)}
        if(i.review){var r=el('span','badge b-rev',i.review==='mock'?'Mock-Daten':'Inhalt prüfen');r.title='Review-Status: '+i.review;b.appendChild(r)}
        li.appendChild(b);
      }
      li.appendChild(el('div','tags',i.tags.join(' · ')));
      var a=el('div','actions');
      var o=el('a','btn primary','Öffnen');o.href=url(i.file);o.target='_blank';o.rel='noopener';o.setAttribute('aria-label','Öffnen: '+i.title);
      var d=el('a','btn','Download');d.href=url(i.file);d.setAttribute('download','');d.setAttribute('aria-label','Download: '+i.title);
      a.appendChild(o);a.appendChild(d);li.appendChild(a);
      grid.appendChild(li);
    });
  }
  q.addEventListener('input',render);cat.addEventListener('change',render);lvl.addEventListener('change',render);
  render();
})();
</script>
