<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORBITRON AI CHATROOM — Redline Edition</title>
<meta name="description" content="AI Chatroom mit Experten-KI für Coding, Design, Business und mehr.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root {
    --bg: #0a0204;
    --bg-deep: #160608;
    --panel: rgba(31, 9, 14, .94);
    --card: rgba(47, 13, 21, .78);
    --line: rgba(251, 113, 133, .22);
    --line-strong: rgba(251, 113, 133, .64);
    --text: #fff1f2;
    --muted: #c597a1;
    --dim: #7c4b57;
    --accent: #fb7185;
    --accent-hot: #ef4444;
    --accent-deep: #991b1b;
    --gold: #fbbf24;
    --cyan: #06b6d4;
    --ok: #10b981;
    --bad: #ef4444;
    --code: #070a12;
    --on-accent: #04121a;
    --me: rgba(251, 113, 133, .12);
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, var(--bg) 0%, #260b12 50%, var(--bg-deep) 100%);
    color: var(--text);
    line-height: 1.55;
    overflow: hidden;
  }
  button, textarea, select { font: inherit; color: inherit; }
  button:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 2px;
  }

  .app {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr);
    height: 100dvh;
    position: relative;
  }
  .app::before {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    content: "";
    opacity: .18;
    background-image:
      linear-gradient(rgba(251, 113, 133, .08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(251, 113, 133, .08) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: linear-gradient(to bottom, black, transparent 90%);
  }
  .app.lab-open {
    grid-template-columns: 280px minmax(0, 1fr) minmax(320px, 42%);
  }

  /* Sidebar */
  .side {
    position: relative;
    z-index: 2;
    background: var(--panel);
    border-right: 1px solid var(--line-strong);
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding-top: var(--sat);
    box-shadow: 4px 0 20px rgba(0, 0, 0, .3);
  }
  .brand {
    padding: 20px 18px 12px;
    border-bottom: 1px solid var(--line);
  }
  .brand h1 {
    font-weight: 800;
    font-size: 1.15rem;
    letter-spacing: .08em;
    margin-bottom: 4px;
    text-shadow: 0 0 20px rgba(239, 68, 68, .4);
  }
  .brand .accent {
    background: linear-gradient(90deg, var(--accent), var(--accent-hot));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .brand small {
    display: block;
    font-weight: 500;
    color: var(--muted);
    font-size: .78rem;
    letter-spacing: .04em;
  }

  .channels {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    scrollbar-width: thin;
  }
  .channels::-webkit-scrollbar { width: 5px; }
  .channels::-webkit-scrollbar-thumb {
    border-radius: 999px;
    background: rgba(251, 113, 133, .3);
  }

  .ch-title {
    margin: 16px 8px 8px;
    font-size: .72rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ch-title::after {
    flex: 1;
    height: 1px;
    content: "";
    background: linear-gradient(90deg, rgba(251, 113, 133, .3), transparent);
  }

  .ch {
    width: 100%;
    text-align: left;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
    display: flex;
    gap: 10px;
    align-items: center;
    color: var(--muted);
    min-height: 44px;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    margin-bottom: 4px;
  }
  .ch:hover {
    background: rgba(127, 29, 45, .3);
    border-color: var(--line);
    color: var(--text);
    transform: translateX(2px);
  }
  .ch[aria-current="true"] {
    background: rgba(127, 29, 45, .45);
    border-color: var(--line-strong);
    color: var(--text);
    font-weight: 700;
    box-shadow: 0 0 16px rgba(239, 68, 68, .2);
  }
  .ch .icon {
    width: 20px;
    text-align: center;
    color: var(--accent);
    font-size: 1.1rem;
  }

  .side-foot {
    padding: 12px 14px calc(12px + var(--sab));
    border-top: 1px solid var(--line);
    display: grid;
    gap: 8px;
    background: rgba(26, 5, 10, .5);
  }
  .side-foot label {
    font-size: .78rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  select {
    width: 100%;
    padding: 9px 10px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    min-height: 44px;
    cursor: pointer;
  }
  select:hover { border-color: var(--line-strong); }

  .btn {
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 10px;
    padding: 9px 12px;
    cursor: pointer;
    min-height: 44px;
    transition: all 0.2s ease;
  }
  .btn:hover {
    border-color: var(--line-strong);
    background: rgba(127, 29, 45, .3);
  }
  .btn.primary {
    border: 0;
    background: linear-gradient(145deg, var(--accent), var(--accent-hot));
    color: var(--on-accent);
    font-weight: 700;
    box-shadow: 0 0 20px rgba(239, 68, 68, .3);
  }
  .btn.primary:hover {
    box-shadow: 0 0 24px rgba(239, 68, 68, .45);
    transform: translateY(-1px);
  }
  .btn:disabled {
    opacity: .55;
    cursor: not-allowed;
  }
  .btn.small {
    min-height: 34px;
    padding: 6px 12px;
    font-size: .85rem;
  }

  /* Main */
  .main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    padding-top: var(--sat);
  }

  .top {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line-strong);
    background: var(--panel);
    box-shadow: 0 2px 12px rgba(0, 0, 0, .2);
  }
  .top h1 {
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: .04em;
  }
  .top p {
    color: var(--muted);
    font-size: .82rem;
  }
  .top .grow {
    flex: 1;
    min-width: 0;
  }
  .top .grow h1,
  .top .grow p {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .menu-btn {
    display: none;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: .8rem;
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(47, 13, 21, .5);
    border: 1px solid var(--line);
  }
  .status i {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 8px var(--ok);
    display: inline-block;
  }
  .status.busy i {
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold);
    animation: pulse 1.5s infinite;
  }
  .status.err i {
    background: var(--bad);
    box-shadow: 0 0 8px var(--bad);
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .log {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
    scrollbar-width: thin;
  }
  .log::-webkit-scrollbar { width: 6px; }
  .log::-webkit-scrollbar-thumb {
    border-radius: 999px;
    background: rgba(251, 113, 133, .3);
  }

  .notice {
    margin: 0 16px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: .82rem;
    background: rgba(251, 191, 36, .12);
    border: 1px solid rgba(251, 191, 36, .4);
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .notice[hidden] { display: none; }
  .notice button {
    margin-left: auto;
    background: transparent;
    border: 0;
    cursor: pointer;
    font-size: 1.2rem;
    line-height: 1;
    padding: 0 4px;
    color: var(--gold);
  }

  .msg {
    display: flex;
    gap: 12px;
    max-width: 880px;
    width: 100%;
    animation: slideIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.me {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .avatar {
    flex: 0 0 38px;
    height: 38px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: .9rem;
    background: linear-gradient(135deg, var(--accent), var(--accent-hot));
    color: var(--on-accent);
    border: 2px solid var(--line-strong);
    box-shadow: 0 0 16px rgba(239, 68, 68, .3);
  }
  .msg.me .avatar {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--line);
    box-shadow: none;
  }

  .bubble {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 16px;
    min-width: 0;
    max-width: 100%;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .2);
  }
  .msg.me .bubble {
    background: var(--me);
    border-color: var(--line-strong);
  }

  .meta {
    font-size: .75rem;
    color: var(--muted);
    margin-bottom: 6px;
    display: flex;
    gap: 8px;
  }
  .meta b {
    color: var(--text);
  }

  .content {
    overflow-wrap: anywhere;
  }
  .content p {
    margin: 6px 0;
  }
  .content ul,
  .content ol {
    margin: 6px 0 6px 22px;
  }
  .content h4 {
    margin: 10px 0 4px;
    font-size: 1rem;
    color: var(--accent);
  }
  .content code.inline {
    background: rgba(6, 182, 212, .14);
    border-radius: 6px;
    padding: 2px 6px;
    font: .9em Consolas, "Courier New", monospace;
    color: var(--cyan);
  }
  .content a {
    color: var(--accent);
    text-decoration: underline;
  }
  .content a:hover {
    color: var(--accent-hot);
  }

  .code {
    margin: 10px 0;
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    overflow: hidden;
    background: var(--code);
    box-shadow: 0 4px 12px rgba(0, 0, 0, .3);
  }
  .code-bar {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 8px 12px;
    background: rgba(251, 113, 133, .08);
    color: #cbd5e1;
    font-size: .78rem;
    border-bottom: 1px solid var(--line);
  }
  .code-bar .lang {
    margin-right: auto;
    letter-spacing: .08em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--accent);
  }
  .code-bar button {
    background: transparent;
    border: 1px solid rgba(251, 113, 133, .35);
    color: #e2e8f0;
    border-radius: 8px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: .78rem;
    min-height: 28px;
    transition: all 0.2s ease;
  }
  .code-bar button:hover {
    border-color: var(--accent);
    background: rgba(251, 113, 133, .12);
  }
  .code pre {
    padding: 14px 16px;
    overflow-x: auto;
    font: 14px/1.5 Consolas, "Courier New", monospace;
    color: #cbd5e1;
  }

  .typing {
    display: inline-flex;
    gap: 4px;
    padding: 4px 0;
  }
  .typing i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: blink 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: .25; }
    40% { opacity: 1; }
  }

  .err-box {
    border-color: var(--bad);
    background: rgba(239, 68, 68, .08);
  }
  .err-box .content {
    color: var(--text);
  }
  .retry {
    margin-top: 10px;
  }

  .intro {
    align-self: center;
    max-width: 640px;
    text-align: center;
    color: var(--muted);
    margin: 20px 0;
  }
  .intro h2 {
    color: var(--text);
    font-size: 1.35rem;
    margin-bottom: 8px;
    font-weight: 800;
  }
  .intro p {
    line-height: 1.6;
  }

  .chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 6px 16px 0;
  }
  .chip {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    font-size: .84rem;
    min-height: 34px;
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .chip:hover {
    border-color: var(--line-strong);
    color: var(--text);
    background: rgba(127, 29, 45, .3);
    transform: translateY(-2px);
  }

  .composer {
    padding: 12px 16px calc(12px + var(--sab));
  }
  .box {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 8px 8px 8px 14px;
    transition: all 0.2s ease;
  }
  .box:focus-within {
    border-color: var(--line-strong);
    box-shadow: 0 0 16px rgba(251, 113, 133, .2);
  }
  .box textarea {
    flex: 1;
    resize: none;
    border: 0;
    outline: none;
    background: transparent;
    max-height: 180px;
    min-height: 44px;
    padding: 10px 0;
    line-height: 1.45;
  }

  .hint {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: .74rem;
    color: var(--muted);
    margin-top: 6px;
  }

  /* Live-Labor */
  .lab {
    position: relative;
    z-index: 2;
    display: none;
    flex-direction: column;
    border-left: 1px solid var(--line-strong);
    background: var(--panel);
    min-width: 0;
    min-height: 0;
    padding-top: var(--sat);
    box-shadow: -4px 0 20px rgba(0, 0, 0, .3);
  }
  .app.lab-open .lab {
    display: flex;
  }

  .lab-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    background: rgba(26, 5, 10, .5);
  }
  .lab-head h2 {
    font-size: .95rem;
    margin-right: auto;
    font-weight: 800;
  }

  .lab textarea {
    flex: 1;
    min-height: 140px;
    resize: none;
    border: 0;
    outline: none;
    background: var(--code);
    color: #cbd5e1;
    font: 14px/1.5 Consolas, "Courier New", monospace;
    padding: 14px 16px;
    tab-size: 2;
  }
  .lab iframe {
    flex: 1;
    min-height: 140px;
    border: 0;
    background: #fff;
    border-top: 1px solid var(--line);
  }
  .lab-foot {
    display: flex;
    gap: 8px;
    padding: 10px 14px calc(10px + var(--sab));
    border-top: 1px solid var(--line);
    flex-wrap: wrap;
    background: rgba(26, 5, 10, .5);
  }

  .scrim {
    display: none;
  }

  @media (max-width: 900px) {
    .app,
    .app.lab-open {
      grid-template-columns: minmax(0, 1fr);
    }
    .side {
      position: fixed;
      z-index: 30;
      inset: 0 auto 0 0;
      width: min(300px, 86vw);
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .app.nav-open .side {
      transform: none;
      box-shadow: 8px 0 30px rgba(0, 0, 0, .6);
    }
    .app.nav-open .scrim {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(0, 0, 0, .7);
    }
    .menu-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .app.lab-open .lab {
      position: fixed;
      z-index: 40;
      inset: 0;
    }
    .status span {
      display: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation: none !important;
      transition: none !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="AI Experten">
    <div class="brand">
      <h1>ORBITRON <span class="accent">AI CHATROOM</span></h1>
      <small>Redline Edition — Experten für jedes Thema</small>
    </div>
    <nav class="channels" id="channels" aria-label="Expertenliste"></nav>
    <div class="side-foot">
      <div>
        <label for="model"><i class="fa-solid fa-brain"></i> KI-Modus</label>
        <select id="model">
          <option value="fast">Schnell (empfohlen)</option>
          <option value="deep">Gründlich (langsamer, mehr Verbrauch)</option>
        </select>
      </div>
      <button class="btn small" id="export" type="button"><i class="fa-solid fa-download"></i> Verlauf exportieren</button>
      <button class="btn small" id="clear" type="button"><i class="fa-solid fa-trash"></i> Chat leeren</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="top">
      <button class="btn menu-btn small" id="menu" type="button" aria-label="Experten öffnen"><i class="fa-solid fa-bars"></i></button>
      <div class="grow">
        <h1 id="chTitle">Experte</h1>
        <p id="chDesc"></p>
      </div>
      <div class="status" id="status" role="status">
        <i></i>
        <span id="statusText">bereit</span>
      </div>
      <button class="btn small" id="labToggle" type="button" aria-pressed="false"><i class="fa-solid fa-code"></i> Live-Editor</button>
    </header>

    <div class="notice" id="notice">
      <i class="fa-solid fa-shield-halved" style="color: var(--gold);"></i>
      <span>Dein Verlauf bleibt nur in diesem Browser. Gib keine Passwörter, Schlüssel oder Kundendaten ein. KI-Antworten können falsch sein: Code immer testen.</span>
      <button type="button" id="noticeClose" aria-label="Hinweis schließen">×</button>
    </div>

    <div class="log" id="log" role="log" aria-live="polite" aria-label="Chatverlauf"></div>
    <div class="chips" id="chips"></div>

    <form class="composer" id="composer" autocomplete="off">
      <div class="box">
        <textarea id="input" rows="1" maxlength="6000" placeholder="Stell eine Frage oder füge deinen Code ein ..." aria-label="Nachricht"></textarea>
        <button class="btn primary" id="send" type="submit"><i class="fa-solid fa-paper-plane"></i></button>
        <button class="btn" id="stop" type="button" hidden><i class="fa-solid fa-stop"></i></button>
      </div>
      <div class="hint">
        <span><i class="fa-solid fa-keyboard"></i> Enter sendet, Shift+Enter neue Zeile</span>
        <span id="count">0 / 6000</span>
      </div>
    </form>
  </main>

  <section class="lab" id="lab" aria-label="Live-Editor">
    <div class="lab-head">
      <h2><i class="fa-solid fa-code"></i> Live-Editor</h2>
      <button class="btn small" id="labReset" type="button"><i class="fa-solid fa-rotate-left"></i> Reset</button>
      <button class="btn small" id="labClose" type="button" aria-label="Live-Editor schließen"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <textarea id="labCode" spellcheck="false" aria-label="Code im Live-Editor"></textarea>
    <iframe id="labFrame" sandbox="allow-scripts" title="Live-Vorschau"></iframe>
    <div class="lab-foot">
      <button class="btn small primary" id="labAsk" type="button"><i class="fa-solid fa-magnifying-glass-chart"></i> Code prüfen lassen</button>
    </div>
  </section>
</div>

<script>
(function () {
  'use strict';

  // ===== Konfiguration =====
  var CONFIG = {
    endpoint: 'https://glow-up-gemini.replit.app/gemini',
    models: { fast: 'gemini-3.5-flash-lite', deep: 'gemini-3.5-flash' },
    maxInputChars: 6000,
    historyCharBudget: 24000,
    maxOutputTokens: 2048
  };

  var BASE_SYSTEM = [
    'Du bist ein KI-Experte im ORBITRON AI CHATROOM.',
    'Antworte auf Deutsch in der du-Form, kurz und konkret.',

  function textBlocks(src) {
    var out = [], list = null, para = [];
    function flushPara() {
      if (para.length) {
        out.push('<p>' + inline(para.join(' ')) + '</p>');
        para = [];
      }
    }
    function flushList() {
      if (list) {
        out.push('<' + list.t + '>' + list.items.map(function (i) {
          return '<li>' + inline(i) + '</li>';
        }).join('') + '</' + list.t + '>');
        list = null;
      }
    }
    src.split('\n').forEach(function (line) {
      var m;
      if (!line.trim()) {
        flushPara();
        flushList();
        return;
      }
      if ((m = line.match(/^\s*#{1,4}\s+(.*)$/))) {
        flushPara();
        flushList();
        out.push('<h4>' + inline(m[1]) + '</h4>');
        return;
      }
      if ((m = line.match(/^\s*[-*]\s+(.*)$/))) {
        flushPara();
        if (!list || list.t !== 'ul') {
          flushList();
          list = { t: 'ul', items: [] };
        }
        list.items.push(m[1]);
        return;
      }
      if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
        flushPara();
        if (!list || list.t !== 'ol') {
          flushList();
          list = { t: 'ol', items: [] };
        }
        list.items.push(m[1]);
        return;
      }
      flushList();
      para.push(line.trim());
    });
    flushPara();
    flushList();
    return out.join('');

  // ===== KI-Aufruf =====
  function buildContents(hist) {
    var budget = CONFIG.historyCharBudget, out = [];
    for (var i = hist.length - 1; i >= 0; i--) {
      var t = hist[i].text || '';
      if (budget - t.length < 0 && out.length) break;
      budget -= t.length;
      out.unshift({
        role: hist[i].role === 'user' ? 'user' : 'model',
        parts: [{ text: t.slice(0, CONFIG.historyCharBudget) }]
      });
    }
    while (out.length && out[0].role !== 'user') out.shift();
    return out;
  }
  function errorText(status, body) {
    var code = '', msg = '';
    try {
      var j = JSON.parse(body);
      code = j.error && j.error.code || j.error || '';
      msg = j.message || (j.error && j.error.message) || '';
      if (typeof code === 'object') code = '';
    } catch (e) {}
    if (/INPUT_TOKEN_LIMIT/.test(code + body)) return 'Der Verlauf oder deine Nachricht ist zu lang. Bitte stelle die Frage kürzer oder leere den Chat.';
    if (/SESSION_TOKEN_BUDGET/.test(code + body)) return 'Das Kontingent des KI-Zugangs ist gerade aufgebraucht. Bitte versuche es später erneut.';
    if (status === 429 || /rate limit/i.test(body)) return 'Zu viele Anfragen in kurzer Zeit. Warte einen Moment und versuche es erneut.';
    if (status >= 500) return 'Der KI-Zugang antwortet gerade nicht (Serverfehler ' + status + '). Bitte später erneut versuchen.';
    return 'Die Anfrage ist fehlgeschlagen' + (status ? ' (Code ' + status + ')' : '') + (msg ? ': ' + msg : '') + '.';

  // Wiederholt bei Verbindungsfehlern (auch CORS-Fehler durch kurz ausfallende Server) und bei 429/502/503/504
  async function fetchRetry(url, opts) {
    for (var i = 0; i < 4; i++) {
      try {
        var r = await fetch(url, opts);
        if ((r.status === 429 || r.status === 502 || r.status === 503 || r.status === 504) && i < 3) {
          await new Promise(function (ok) { setTimeout(ok, 1500 * (i + 1)); });
          continue;
        }
        return r;
      } catch (e) {
        if (e && e.name === 'AbortError') throw e;
        if (i < 3) await new Promise(function (ok) { setTimeout(ok, 1500 * (i + 1)); });
      }
    }
    var err = new Error('Keine Verbindung zum Experten-Server (Netzwerk- oder CORS-Fehler). Er startet vermutlich gerade. Warte etwa eine Minute und sende erneut, die Seite musst du nicht neu laden.');
    err.known = true;
    throw err;
  }

  var lastFinish = '';
  async function streamAnswer(contents, onText, signal) {
    lastFinish = '';
    var model = CONFIG.models[state.model] || CONFIG.models.fast;
    var body = JSON.stringify({
      systemInstruction: {
        parts: [{ text: BASE_SYSTEM + '\n\nAktueller Experte: ' + ch().name + '. ' + ch().focus }]
      },
      contents: contents,
      generationConfig: { maxOutputTokens: CONFIG.maxOutputTokens, temperature: 0.5 }
    });
    var res = await fetchRetry(CONFIG.endpoint + '/models/' + model + '/streamGenerateContent?alt=sse', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: body,
      signal: signal
    });
    if (!res.ok) {
      var e = new Error(errorText(res.status, await res.text()));
      e.known = true;
      throw e;
    }
    var reader = res.body.getReader(), dec = new TextDecoder(), buf = '', got = false;
    function handle(ev) {
      ev.split('\n').forEach(function (line) {
        if (line.indexOf('data:') !== 0) return;
        var raw = line.slice(5).trim();
        if (!raw || raw === '[DONE]') return;
        var j;
        try {
          j = JSON.parse(raw);
        } catch (x) {
          return;
        }
        if (j.error) {
          var er = new Error(errorText(0, JSON.stringify(j)));
          er.known = true;
          throw er;
        }
        var parts = j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts || [];
        if (j.candidates && j.candidates[0] && j.candidates[0].finishReason) lastFinish = j.candidates[0].finishReason;
        parts.forEach(function (p) {
          if (p.text && !p.thought) {
            got = true;
            onText(p.text);
          }
        });
      });
    }
    while (true) {
      var r = await reader.read();
      if (r.done) break;
      buf += dec.decode(r.value, { stream: true }).replace(/\r\n/g, '\n');
      var evs = buf.split('\n\n');
      buf = evs.pop();
      evs.forEach(handle);
    }
    buf += dec.decode();
    if (buf.trim()) handle(buf.replace(/\r\n/g, '\n'));
    if (!got) {
      var em = new Error('Der Experte hat keine Antwort geliefert. Bitte formuliere die Frage anders oder versuche es erneut.');
      em.known = true;
      throw em;
    }
  }

  function abortRun() {

  function setBusy(b) {

  async function ask(text) {
    var id = state.channel, c = ch();

    if (text.length > CONFIG.maxInputChars) text = text.slice(0, CONFIG.maxInputChars);

    h.push({ role: 'user', text: text, ts: Date.now() });

    var holder = msgEl({ role: 'assistant', text: '', ts: Date.now() }, { typing: true });
    logEl.appendChild(holder);
    scrollDown();
    var contentEl = holder.querySelector('.content');
    var acc = '', started = false;
    state.controller = new AbortController();
    setBusy(true);
    try {
      await streamAnswer(buildContents(h), function (t) {
        acc += t;
        started = true;

      }, state.controller.signal);
      if (lastFinish === 'MAX_TOKENS') {
        acc += '\n\n**(Antwort wegen des Längenlimits gekürzt. Schreibe „weiter“, dann geht es an der Stelle weiter.)**';
        contentEl.innerHTML = renderMd(acc);
      }
      h.push({ role: 'assistant', text: acc, ts: Date.now() });
      saveHist(id);
      setStatus('', 'bereit');
    } catch (e) {
      if (e.name === 'AbortError') {
        if (acc) {
          h.push({ role: 'assistant', text: acc + '\n\n(abgebrochen)', ts: Date.now() });
          saveHist(id);
        } else holder.remove();

        var errEl = msgEl({ role: 'assistant', text: msg, ts: Date.now() }, { error: true });

        retry.className = 'btn small retry';
        retry.innerHTML = '<i class="fa-solid fa-rotate-right"></i> Erneut versuchen';
        retry.addEventListener('click', function () {
          h.pop();
          saveHist(id);
          errEl.remove();
          ask(text);
        });
        errEl.querySelector('.bubble').appendChild(retry);
        holder.replaceWith(errEl);
        setStatus('err', 'Fehler');
      }
    } finally {
      setBusy(false);
      state.controller = null;
      if (state.channel === id) {
        if (acc && !logEl.contains(holder)) renderLog();
      }
    }
  }

      labFrame.srcdoc = labCode.value;
    }, 300);
  });
  $('labToggle').addEventListener('click', function () {
    app.classList.contains('lab-open') ? closeLab() : openLab();
  });
  $('labClose').addEventListener('click', closeLab);
  $('labReset').addEventListener('click', function () {
    labCode.value = state.labDefault;
    labFrame.srcdoc = labCode.value;
  });
  $('labAsk').addEventListener('click', function () {
    var code = labCode.value.trim();
    if (!code) return;
    if (!ch().lab) switchChannel('code-review');
    app.classList.remove('lab-open');
    ask('Bitte prüfe meinen Code aus dem Live-Editor und nenne die wichtigsten Verbesserungen:\n\n' + code.slice(0, 5000) + '\n');
    if (window.innerWidth > 900) openLab();
  });

  // ===== Ereignisse =====
  logEl.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-act]');
    if (!b) return;
    var code = b.closest('.code').querySelector('code').textContent;
    if (b.dataset.act === 'copy') {
      var done = function () {
        b.innerHTML = '<i class="fa-solid fa-check"></i> Kopiert';
        setTimeout(function () {
          b.innerHTML = '<i class="fa-solid fa-copy"></i> Kopieren';
        }, 1300);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, done);
      else {
        var ta = document.createElement('textarea');
        ta.value = code;
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
        } catch (x) {}
        ta.remove();
        done();
      }
    } else if (b.dataset.act === 'lab') openLab(code, b.dataset.lang);
  });
  function autosize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 180) + 'px';
  }
  function updateCount() {
    $('count').textContent = input.value.length + ' / ' + CONFIG.maxInputChars;
  }
  input.addEventListener('input', function () {
    autosize();
    updateCount();
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      $('composer').requestSubmit();
    }
  });
  $('composer').addEventListener('submit', function (e) {
    e.preventDefault();
    var t = input.value;
    if (!t.trim()) return;
    input.value = '';
    autosize();
    updateCount();
    ask(t);
  });
  stopBtn.addEventListener('click', abortRun);
  $('menu').addEventListener('click', function () {
    app.classList.add('nav-open');
  });
  $('scrim').addEventListener('click', function () {
    app.classList.remove('nav-open');
  });
  $('model').addEventListener('change', function (e) {
    state.model = e.target.value;
    store('model', state.model);
  });
  $('noticeClose').addEventListener('click', function () {
    $('notice').hidden = true;
    store('notice', '1');
  });
  $('clear').addEventListener('click', function () {
    if (!window.confirm('Verlauf dieses Chats auf diesem Gerät löschen?')) return;
    state.hist[state.channel] = [];
    saveHist(state.channel);
    renderLog();
  });
  $('export').addEventListener('click', function () {
    var c = ch(), lines = ['# ORBITRON AI CHATROOM: ' + c.name, ''];
    state.hist[c.id].forEach(function (m) {
      lines.push('## ' + (m.role === 'user' ? 'Du' : 'AI Experte') + ' (' + new Date(m.ts).toLocaleString('de-DE') + ')', '', m.text, '');
    });
    var blob = new Blob([lines.join('\n')], { type: 'text/markdown;charset=utf-8' }),
      a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'orbitron-chat-' + c.id + '.md';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () {
      URL.revokeObjectURL(a.href);
    }, 1000);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      app.classList.remove('nav-open');
    }
  });

  // ===== Start =====
  (function init() {
    var m = store('model');
    if (m && CONFIG.models[m]) {
      state.model = m;
      $('model').value = m;
    }
    if (store('notice') === '1') $('notice').hidden = true;
    var c = store('channel');
    try {
      var qc = new URLSearchParams(location.search).get('channel');
      if (qc) c = qc;
    } catch (e) {}
    switchChannel(CHANNELS.some(function (x) {
      return x.id === c;
    }) ? c : 'webdev');
  })();
})();
</script>
</body>
</html>
