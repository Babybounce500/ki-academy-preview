<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Webinar-Video</title>
<style>
:root{--bg:#070b18;--bg2:#0d1330;--panel:rgba(255,255,255,.05);--line:rgba(148,163,184,.22);--text:#f1f5f9;--muted:#a8b3c7;--blue:#3b82f6;--indigo:#6366f1;--cyan:#22d3ee;--green:#34d399;--gold:#fbbf24;--pink:#f472b6;--bar:64px}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,rgba(99,102,241,.25),transparent 60%),radial-gradient(900px 500px at 0% 30%,rgba(59,130,246,.16),transparent 60%),var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
a{color:inherit}img{max-width:100%}
.skip{position:absolute;left:-999px;top:8px;background:var(--gold);color:#111;padding:8px 14px;border-radius:8px;z-index:100}.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{width:min(1120px,100% - 32px);margin-inline:auto}
header.top{position:sticky;top:0;z-index:50;background:rgba(7,11,24,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:14px;min-height:var(--bar)}
.brand{font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:1.02rem;background:linear-gradient(90deg,#60a5fa,#818cf8);-webkit-background-clip:text;background-clip:text;color:transparent;text-decoration:none;white-space:nowrap}
nav.main{margin-left:auto;display:flex;gap:4px;align-items:center}
nav.main a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-size:.92rem;font-weight:600}
nav.main a:hover{color:#fff;background:var(--panel)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-left:6px}
.lang a{padding:6px 12px;font-size:.8rem;font-weight:700;text-decoration:none;color:var(--muted)}
.lang a[aria-current=true]{background:linear-gradient(90deg,var(--blue),var(--indigo));color:#fff}
.burger{display:none;margin-left:auto;width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:transparent;color:#fff;font-size:20px}
@media(max-width:860px){.burger{display:grid;place-items:center}nav.main{display:none;position:absolute;left:0;right:0;top:var(--bar);flex-direction:column;align-items:stretch;padding:10px 16px 16px;background:#0b1126;border-bottom:1px solid var(--line)}nav.main.open{display:flex}nav.main a{padding:12px}.lang{align-self:flex-start;margin:8px 0 0}}
.hero{position:relative;padding:clamp(56px,9vw,110px) 0 clamp(48px,7vw,84px);text-align:center;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(148,163,184,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.07) 1px,transparent 1px);background-size:54px 54px;mask-image:radial-gradient(ellipse at 50% 30%,#000,transparent 70%)}
.hero .wrap{position:relative}
.pill{display:inline-block;padding:7px 18px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem}
h1{margin:22px auto 10px;font-size:clamp(2rem,6vw,4rem);line-height:1.08;font-weight:900;letter-spacing:-.01em;max-width:18ch}
h1 span{background:linear-gradient(90deg,#60a5fa,#a5b4fc,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{max-width:60ch;margin:0 auto 28px;color:#cbd5e1;font-size:clamp(1.02rem,2.2vw,1.3rem)}
.cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:9px;min-height:46px;padding:11px 22px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:#fff;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;transition:transform .15s,background .15s,border-color .15s}
.btn:hover{transform:translateY(-2px);border-color:rgba(148,163,184,.5)}
.btn.primary{border:0;background:linear-gradient(90deg,var(--blue),var(--indigo));box-shadow:0 10px 30px rgba(79,70,229,.35)}
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:36px}
.chip{display:flex;align-items:center;gap:10px;padding:10px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);font-size:.9rem;font-weight:600}
.chip i{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--indigo));font-style:normal}
section.block{padding:clamp(44px,7vw,84px) 0}
.eyebrow{display:block;text-align:center;color:#60a5fa;font-weight:700;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase}
h2{margin:8px 0 6px;text-align:center;font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.15}
.sub{max-width:62ch;margin:0 auto 34px;text-align:center;color:var(--muted)}
.video{max-width:900px;margin-inline:auto}
.vtabs{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.vtabs button{min-height:40px;padding:8px 18px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-weight:700;cursor:pointer}
.vtabs button[aria-selected=true]{background:linear-gradient(90deg,var(--blue),var(--indigo));border-color:transparent;color:#fff}
.stage{position:relative;margin-inline:auto;width:100%;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#02040c;box-shadow:0 30px 80px rgba(0,0,0,.5);aspect-ratio:16/9}
.stage.portrait{aspect-ratio:9/16;max-width:380px}
.stage iframe,.stage video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.poster{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:14px;padding:24px;border:0;width:100%;color:#fff;font:inherit;cursor:pointer;text-align:center;background:radial-gradient(circle at 50% 40%,rgba(99,102,241,.45),transparent 60%),linear-gradient(160deg,#0f1a44,#060a1c)}
.poster .play{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.5);font-size:30px;padding-left:5px;transition:transform .2s}
.poster:hover .play{transform:scale(1.08)}
.poster b{font-size:1.1rem}.poster small{max-width:46ch;color:#b6c2da;font-size:.82rem}
.vmeta{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:16px;color:var(--muted);font-size:.9rem}
.steps{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));counter-reset:s}
.step{position:relative;padding:22px 20px 20px;border:1px solid var(--line);border-radius:16px;background:var(--panel);counter-increment:s}
.step::before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;margin-bottom:12px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--indigo));font-weight:800}
.step h3{margin:0 0 6px;font-size:1.05rem}.step p{margin:0;color:var(--muted);font-size:.93rem}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.card{display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--panel);transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-4px);border-color:rgba(148,163,184,.5)}
.card .im{position:relative;aspect-ratio:16/9;overflow:hidden;background:#0b1126}
.card .im img{width:100%;height:100%;object-fit:cover;display:block}
.card .im::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(2,6,23,.7),transparent 55%)}
.badge{position:absolute;left:12px;bottom:10px;z-index:2;padding:3px 11px;border-radius:999px;font-size:.74rem;font-weight:800;color:#06101f}
.card .bd{display:flex;flex:1;flex-direction:column;gap:10px;padding:18px 18px 20px}
.card h3{margin:0;font-size:1.12rem}.card p{margin:0;color:var(--muted);font-size:.93rem;flex:1}
.acts{display:flex;flex-wrap:wrap;gap:8px}.acts .btn{flex:1 1 auto;justify-content:center;min-height:42px;padding:9px 14px;font-size:.9rem}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.tile{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);text-decoration:none;transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:rgba(148,163,184,.5)}
.tile i{display:grid;place-items:center;flex:0 0 40px;width:40px;height:40px;border-radius:11px;background:rgba(99,102,241,.25);font-style:normal;font-size:19px}
.tile b{display:block;font-size:.95rem}.tile small{color:var(--muted);font-size:.8rem;line-height:1.3;display:block}
.banner{margin-top:56px;padding:clamp(24px,4vw,40px);border-radius:22px;background:linear-gradient(120deg,#2563eb,#4f46e5);display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;box-shadow:0 24px 60px rgba(37,99,235,.3)}
.banner h3{margin:0 0 4px;font-size:1.5rem}.banner p{margin:0;color:#dbeafe}
.banner .btn{background:#fff;color:#1d4ed8;border:0}
footer{margin-top:20px;padding:44px 0 36px;border-top:1px solid var(--line);background:#050816;color:var(--muted);font-size:.9rem}
footer .cols{display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
footer h4{margin:0 0 10px;color:#fff;font-size:1rem}footer p{margin:0 0 8px}footer a{color:#93c5fd}
.note{margin-top:22px;padding:10px 14px;border:1px dashed var(--gold);border-radius:10px;color:var(--gold);font-size:.82rem}
.gate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:16px;background:rgba(2,4,12,.92);backdrop-filter:blur(8px)}
.gate[hidden]{display:none}.gate-box{position:relative;width:min(440px,100%);padding:30px 26px 24px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(160deg,#111a3d,#0a1028);box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center}
.gate-box::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;border-radius:20px 20px 0 0;background:linear-gradient(90deg,var(--blue),var(--indigo))}
.gate-box h2{margin:6px 0 8px;font-size:1.5rem}.gate-box p{margin:0 0 14px;color:var(--muted);font-size:.92rem}
.gate-box input{width:100%;min-height:48px;margin-bottom:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.07);color:#fff;font:inherit}
.gate-box input:focus{border-color:var(--blue)}.gate-box .btn{width:100%;justify-content:center}
.gate-err{margin:12px 0 0!important;color:#fca5a5!important;font-weight:600}.gate-buy{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.sr{position:absolute;left:-9999px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

body{min-height:100dvh;display:flex;flex-direction:column}
.vp{flex:1;display:grid;place-items:center;padding:12px;gap:12px;align-content:center}
.vp .stage{max-height:calc(100dvh - 110px);width:min(100%,calc((100dvh - 110px) * 16 / 9))}
.vp .stage.portrait{width:min(100%,calc((100dvh - 110px) * 9 / 16))}
</style></head>
<body><div class="vp">
<div class="vtabs" role="tablist" aria-label="Video"><button type="button" role="tab" data-v="de" aria-selected="true">Deutsch</button><button type="button" role="tab" data-v="en" aria-selected="false">English</button></div>
<div class="stage" id="stage" role="tabpanel"></div>
</div>
<script>
(function(){
  var VID={de:{type:'iframe',src:"https://share.synthesia.io/embeds/videos/be426683-7eda-4cb9-b4e8-2b603b59d8bd",portrait:false,title:'Webinar-Video (Deutsch)',play:'Video abspielen',note:'Beim Abspielen wird eine Verbindung zu Synthesia hergestellt.'},en:{type:'video',src:"https://domusaurea.tech/webinarenglishvideo.mp4",portrait:true,title:'Webinar video (English)',play:'Play video',note:'Loaded from domusaurea.tech.'}};
  var stage=document.getElementById('stage');
  function show(v){var d=VID[v];stage.innerHTML='';stage.classList.toggle('portrait',d.portrait);
    document.querySelectorAll('.vtabs button').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.v===v))});
    var b=document.createElement('button');b.type='button';b.className='poster';b.setAttribute('aria-label',d.play);b.innerHTML='<span class="play" aria-hidden="true">▶</span><b></b><small></small>';b.querySelector('b').textContent=d.play;b.querySelector('small').textContent=d.note;
    b.addEventListener('click',function(){
      if(d.type==='iframe'){var f=document.createElement('iframe');f.src=d.src;f.title=d.title;f.allow='autoplay; fullscreen; picture-in-picture';f.allowFullscreen=true;f.referrerPolicy='no-referrer';stage.innerHTML='';stage.appendChild(f)}
      else{var m=document.createElement('video');m.src=d.src;m.controls=true;m.autoplay=true;m.playsInline=true;m.setAttribute('aria-label',d.title);stage.innerHTML='';stage.appendChild(m)}});
    stage.appendChild(b);}
  document.querySelectorAll('.vtabs button').forEach(function(b){b.addEventListener('click',function(){show(b.dataset.v)})});
  var q=new URLSearchParams(location.search).get('v');show(q==='en'?'en':'de');
})();
</script></body></html>
