<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IDE-Werkbank</title>
<style>
:root{--bg:#06141a;--panel:#0b1f27;--line:#16424f;--text:#e6f6fa;--muted:#8fb4bf;--accent:#06b6d4;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.side{width:340px;flex:0 0 340px;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-height:0}
.head{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.head h1{margin:0 0 2px;font-size:18px;letter-spacing:.02em}
.head p{margin:0;color:var(--muted);font-size:12.5px}
.search{width:100%;margin-top:10px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#071820;color:var(--text);font-size:16px}
.search:focus{outline:2px solid var(--accent);outline-offset:1px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--muted);min-height:32px}
.chip[aria-pressed=true]{background:var(--accent);color:#04121a;border-color:transparent;font-weight:700}
.list{flex:1;overflow:auto;padding:6px 8px 16px;overscroll-behavior:contain}
.grp{margin:12px 6px 4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.item{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:10px;padding:9px 10px;margin:2px 0;min-height:48px}
.item:hover{background:#0f2a35}
.item[aria-current=true]{background:#0f2f3b;border-color:var(--accent)}
.item b{display:block;font-size:14.5px}
.item small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.ok{color:var(--ok);border-color:#1d5c46}.tag.warn{color:var(--warn);border-color:#6b5316}.tag.bad{color:var(--bad);border-color:#6b2a2a}
.empty{padding:20px;color:var(--muted);text-align:center}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.bar .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.btn{border:1px solid var(--line);background:#071820;border-radius:10px;padding:8px 12px;font-size:13.5px;min-height:40px;text-decoration:none;color:var(--text);display:inline-flex;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.item:focus-visible,.chip:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.menu{display:none}
.stage{flex:1;min-height:0;position:relative;background:#fff}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.welcome{position:absolute;inset:0;background:var(--bg);overflow:auto;padding:22px;color:var(--text)}
.welcome h2{margin:0 0 6px}
.welcome .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:14px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel);text-align:left}
.card:hover{border-color:var(--accent)}
.card b{display:block}.card small{color:var(--muted)}
.note{margin:12px 0 0;padding:10px 12px;border:1px solid #6b5316;border-radius:10px;color:var(--warn);background:#1b1707;font-size:13px}
.back{display:none}
@media(max-width:860px){
 .side{position:fixed;z-index:20;inset:0 auto 0 0;width:min(360px,92vw);transform:translateX(-102%);transition:transform .18s}
 body.open .side{transform:none}
 body.open .back{display:block;position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.55)}
 .menu{display:inline-flex}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<aside class="side" id="side" aria-label="Werkzeuge">
 <div class="head">
  <h1>🧪 IDE-Werkbank</h1>
  <p id="count"></p>
  <input class="search" id="q" type="search" placeholder="Suchen (Name, Engine, Chat, RAG ...)" aria-label="Suchen" autocomplete="off">
  <div class="filters" id="filters"></div>
 </div>
 <div class="list" id="list" role="list"></div>
</aside>
<div class="back" id="back"></div>
<main class="main">
 <div class="bar">
  <button class="btn menu" id="menu" aria-label="Liste öffnen">☰ Liste</button>
  <div class="t" id="title">Wähle ein Werkzeug</div>
  <button class="btn" id="prev" title="Vorheriges (←)">←</button>
  <button class="btn" id="next" title="Nächstes (→)">→</button>
  <button class="btn" id="reload" title="Neu laden">↻</button>
  <a class="btn" id="tab" target="_blank" rel="noopener" href="#">Neuer Tab ↗</a>
 </div>
 <div class="stage" id="stage">
  <div class="welcome" id="welcome">
   <h2>Alle Editoren und IDEs an einem Ort</h2>
   <p style="color:var(--muted);max-width:60ch">Tippe ein Werkzeug an, es lädt direkt hier. Pfeiltasten (← →) blättern durch die Liste. Die Statusmarken zeigen, was beim automatischen Test aufgefallen ist.</p>
   <div class="grid" id="picks"></div>
   <p class="note" id="legend"></p>
  </div>
 </div>
</main>

  });
  $('#legend').textContent = 'Hinweis: KI-Funktionen laufen über den Kurs-Zugang (Proxy). Wenn eine Marke „Dienst offline“ zeigt, ist ein Zusatzdienst dieses Werkzeugs nicht erreichbar. Der Rest funktioniert trotzdem. Daten bleiben im Browser (localStorage / IndexedDB).';

})();
