            justify-content: space-between;

        .sidebar .sidebar-header h3 {

            font-size: 1.4rem;
            color: #ffffff; /* Silver/white for Cowboys theme */
            font-weight: 700;
        }
        .sidebar .sidebar-header .close-sidebar {

            background: none;
            border: none;

        .sidebar .sidebar-menu {

            border: none;
            text-align: left;

            font-size: 1rem;
            display: flex;
            align-items: center;
            cursor: pointer;
            font-family: 'Orbitron', monospace;
            text-decoration: none;
        }
        .sidebar .sidebar-menu .btn-sidebar:hover {
            background-color: rgba(30, 144, 255, 0.2);
            color: #1e90ff;
        }
        .sidebar .sidebar-menu .btn-sidebar .icon {
            width: 24px;
            height: 24px;
            margin-right: 10px;
            object-fit: contain;
        }
        /* Content Area */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin-left: 0;
            transition: margin-left 0.3s ease-in-out;
            overflow-y: auto;
        }
        /* Header - Dallas Cowboys Theme */
        .chat-header {
            background: linear-gradient(135deg, #002244, #041E42); /* Cowboys blue */

            border-bottom: 2px solid #1e90ff;
            display: flex;
            align-items: center;
            position: relative;
            z-index: 500;
            font-size: 1.4rem;

        .chat-header h2 {
            font-size: 1.8rem;
            color: #ffffff; /* Silver/white for Cowboys theme */

            margin: 0;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(30, 144, 255, 0.5);

            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #1e90ff;
            z-index: 1100;
        }
        /* Chat Body */
        .chat-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
            font-size: 1.2rem;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
        }
        .message {
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 15px;
            max-width: 90%;
            word-wrap: break-word;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .user-message {
            background: linear-gradient(135deg, #1e90ff, #0078FF); /* Cowboys blue gradient */
            align-self: flex-end;
            font-size: 1.2rem;
            color: #ffffff; /* White text */
            font-weight: 500;
        }
        .assistant-message {
            background: rgba(30, 144, 255, 0.1); /* Cowboys blue with opacity */
            align-self: flex-start;
            font-size: 1.2rem;
            color: #e0e0e0;
            border: 1px solid rgba(30, 144, 255, 0.3);
        }
        .system-message {
            background: rgba(2, 34, 68, 0.8); /* Dark Cowboys blue */
            color: #ffffff;
            align-self: center;
            font-size: 1.2rem;
            border: 1px solid #1e90ff;
            max-width: 95%;
        }
        .error-message {
            background: rgba(220, 53, 69, 0.2);
            color: #dc3545;
            align-self: center;
            font-size: 1.2rem;
            border: 1px solid #dc3545;
        }
        .image-message img {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 10px;
            box-shadow: 0 0 20px rgba(30, 144, 255, 0.3);
        }
        /* ChatGPT-Style Code Blocks mit Prism.js */
        .code-block-wrapper {
            margin: 15px 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .code-header {
            background: linear-gradient(135deg, #002244, #041E42); /* Cowboys blue */
            padding: 8px 15px;
            border-bottom: 1px solid #1e90ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Orbitron', monospace;
            font-size: 0.8rem;
            color: #1e90ff;
        }
        .copy-code-btn {
            background: linear-gradient(45deg, #1e90ff, #0078FF); /* Cowboys blue gradient */
            border: none;
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Orbitron', monospace;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(30, 144, 255, 0.4);
        }

            color: #ffffff;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Orbitron', monospace;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .run-html-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(40, 167, 69, 0.4);
        }
        pre {
            margin: 0;
            background: #2d3748 !important;
            border-radius: 0 0 12px 12px;
            overflow-x: auto;
        }
        pre code {
            font-family: 'Fira Code', 'Consolas', 'Monaco', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            background: none !important;
            padding: 20px !important;
            display: block;
            white-space: pre-wrap;
            tab-size: 4;
        }
        /* Inline Code */
        code:not(pre code) {
            background: rgba(30, 144, 255, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 0.9em;
            color: #1e90ff;
            border: 1px solid rgba(30, 144, 255, 0.3);
        }
        /* Prism Theme Overrides für Orbitron-Style */
        .token.comment,
        .token.prolog,
        .token.doctype,
        .token.cdata {
            color: #718096;
        }
        .token.punctuation {
            color: #1e90ff;
        }
        .token.property,
        .token.tag,
        .token.boolean,
        .token.number,
        .token.constant,
        .token.symbol,
        .token.deleted {
            color: #f56565;
        }
        .token.selector,
        .token.attr-name,
        .token.string,
        .token.char,
        .token.builtin,
        .token.inserted {
            color: #68d391;
        }
        .token.operator,
        .token.entity,
        .token.url,
        .language-css .token.string,
        .style .token.string {
            color: #1e90ff;
        }
        .token.atrule,
        .token.attr-value,
        .token.keyword {
            color: #9f7aea;
        }
        .token.function,
        .token.class-name {
            color: #f6e05e;
        }
        /* HTML Preview Container */
        .html-preview-container {
            margin-top: 15px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            background: #2d3748;
            position: relative;

        .html-preview-header {

            justify-content: space-between;
            align-items: center;
            font-family: 'Orbitron', monospace;
            font-size: 0.8rem;
            color: #1e90ff;
        }
        .html-preview-content {
            padding: 15px;
            min-height: 200px;
            position: relative;
        }
        .html-preview-iframe {
            width: 100%;
            border: none;
            min-height: 200px;
            background: white;
        }
        .html-preview-actions {
            padding: 8px 15px;
            background: #2d3748;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .preview-action-button {
            background: linear-gradient(45deg, #1e90ff, #0078FF); /* Cowboys blue gradient */

            color: #ffffff;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Orbitron', monospace;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .preview-action-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(30, 144, 255, 0.4);
        }
        /* Message Actions */
        .message-actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-start;
        }
        .action-button {
            padding: 6px 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            color: white;
            position: relative;
            font-family: 'Orbitron', monospace;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .action-button .spinner-border {
            width: 1em;
            height: 1em;
            border-width: 2px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
        }
        .action-button.loading .icon {
            visibility: hidden;
        }
        .action-button.loading .spinner-border {
            display: inline-block;
        }
        .copy-button {
            background: linear-gradient(45deg, #1e90ff, #0078FF); /* Cowboys blue gradient */
            color: #ffffff;
        }
        .copy-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(30, 144, 255, 0.4);
        }
        .listen-button {
            background: linear-gradient(45deg, #ffc107, #ffb300);
            color: #000;
        }
        .listen-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.4);
        }
        .download-button {
            background: linear-gradient(45deg, #28a745, #20c997);
        }
        .download-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }
        .draw-button {
            background: linear-gradient(45deg, #fd7e14, #e76a08);
        }
        .draw-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(253, 126, 20, 0.4);
        }
        /* Prompt Mapping Buttons */
        .prompt-button {
            background: linear-gradient(45deg, #002244, #041E42); /* Cowboys blue */
            color: #ffffff;
            border: 1px solid #1e90ff;
        }
        .prompt-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(30, 144, 255, 0.4);
            background: linear-gradient(45deg, #1e90ff, #0078FF);
        }
        /* Special Action Buttons */
        .special-action-button {
            background: linear-gradient(45deg, #8B4513, #A0522D); /* Brown gradient */
            color: #ffffff;
            border: 1px solid #8B4513;
        }
        .special-action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(139, 69, 19, 0.4);
            background: linear-gradient(45deg, #A0522D, #8B4513);
        }
        /* Chat Footer */
        .chat-footer {
            background: linear-gradient(135deg, #002244, #041E42); /* Cowboys blue */
            display: flex;
            padding: 25px 20px;
            border-top: 2px solid #1e90ff;
            justify-content: space-between;
            align-items: center;
            flex-wrap: nowrap;
        }
        .chat-footer input[type="text"] {
            flex: 1;
            padding: 15px 25px;
            margin-right: 15px;
            border: 2px solid #1e90ff;
            border-radius: 25px;
            font-size: 1.2rem;
            outline: none;
            transition: all 0.3s;
            height: 60px;
            background: rgba(0, 0, 0, 0.5);
            color: #e0e0e0;
            font-family: 'Orbitron', monospace;
        }
        .chat-footer input[type="text"]:focus {
            border-color: #0078FF;
            box-shadow: 0 0 15px rgba(30, 144, 255, 0.3);
        }
        .chat-footer input[type="text"]::placeholder {
            color: #888;
        }
        .buttons-group {
            display: flex;
            gap: 10px;
        }
        .buttons-group button {
            width: 55px;
            height: 55px;
            border: none;
            border-radius: 50%;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font-family: 'Orbitron', monospace;
        }
        .buttons-group button:hover {
            transform: translateY(-3px);
        }
        .send-button {
            background: linear-gradient(45deg, #1e90ff, #0078FF); /* Cowboys blue gradient */
            color: #ffffff;
            font-weight: 700;
        }
        .send-button:hover {
            box-shadow: 0 8px 25px rgba(30, 144, 255, 0.5);
        }
        .dalle-button {
            background: linear-gradient(45deg, #fd7e14, #e76a08);
            color: #fff;
            font-weight: 700;
        }
        .dalle-button:hover {
            box-shadow: 0 8px 25px rgba(253, 126, 20, 0.5);
        }
        /* Loading States */
        .loading .spinner-border {
            width: 1em;
            height: 1em;
            border-width: 2px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .loading .icon {
            visibility: hidden;
        }
        /* Responsive Styles */
        @media (min-width: 768px) {
            .main-content {
                flex-direction: row;
            }
            .content-area.visible {
                margin-left: 220px;
            }
        }
        @media (max-width: 767px) {
            .chat-footer input[type="text"] {
                height: 50px;
                padding: 12px 20px;
                font-size: 1rem;
            }
            .buttons-group button {
                width: 45px;
                height: 45px;
                font-size: 1.2rem;
            }
        }
        #dalleButton {
    display: none !important;
}

    </style>

            addMessage('system',
                '<span style="color: #dcdcdc;"><i>✨ GENerate IT with US – Genitus Inc.</i></span><br>' +
                '<span style="color: #ffffff;">🏗️ AI Software Factory | ⚙️ 41+ AI Tools | 🌐 CelestiaOS</span>'
            );

            messageInput.addEventListener('keydown', function(event) {
                if (event.key === 'Enter' && !event.shiftKey) {
                    event.preventDefault();
                    sendMessage();
                }
            });

            console.log("⚙️ Genitus Inc. GPTurbo initialized with CelestiaOS v1.0");
        });

        // Sidebar Functions
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const contentArea = document.getElementById('content-area');

            sidebar.classList.toggle('visible');
            contentArea.classList.toggle('visible');
        }

        function newChat() {
            chatHistory = [];
            chatBody.innerHTML = '';
            addMessage('system', '🚀 New project started. How can I help with your AI software development today?');
        }

        function clearHistory() {
            newChat();
        }

        // Message Functions
        function addMessage(role, content, isError = false) {
            const messageDiv = document.createElement('div');

            if (isError) {
                messageDiv.className = 'message error-message';
            } else if (role === 'user') {
                messageDiv.className = 'message user-message';
            } else if (role === 'system') {
                messageDiv.className = 'message system-message';
            } else {
                messageDiv.className = 'message assistant-message';
            }

            const contentDiv = document.createElement('div');
            contentDiv.innerHTML = formatMessage(content);
            messageDiv.appendChild(contentDiv);

            // Check if the message contains HTML code and add preview
            if (role === 'assistant' && containsHtmlCode(content)) {
                const htmlCode = extractHtmlCode(content);
                if (htmlCode) {
                    addHtmlPreview(messageDiv, htmlCode);
                }
            }

            // Add action buttons for assistant messages
            if (role === 'assistant' && !isError) {
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'message-actions';

                // Standard action buttons
                const copyBtn = document.createElement('button');
                copyBtn.className = 'action-button copy-button';
                copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy';
                copyBtn.onclick = () => copyToClipboard(content);

                const listenBtn = document.createElement('button');
                listenBtn.className = 'action-button listen-button';
                listenBtn.innerHTML = '<i class="fas fa-volume-up"></i> Listen';
                listenBtn.onclick = () => speakText(content);

                const downloadBtn = document.createElement('button');
                downloadBtn.className = 'action-button download-button';
                downloadBtn.innerHTML = '<i class="fas fa-download"></i> Download';
                downloadBtn.onclick = () => downloadText(content, 'genitus-gpt-response.txt');

                // Add prompt mapping buttons
                const summarizeBtn = document.createElement('button');
                summarizeBtn.className = 'action-button prompt-button';
                summarizeBtn.innerHTML = '<i class="fas fa-compress-alt"></i> Summarize';
                summarizeBtn.onclick = () => mapPrompt('summarize', content);

                const rephraseBtn = document.createElement('button');
                rephraseBtn.className = 'action-button prompt-button';
                rephraseBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Rephrase';
                rephraseBtn.onclick = () => mapPrompt('rephrase', content);

                const expandBtn = document.createElement('button');
                expandBtn.className = 'action-button prompt-button';
                expandBtn.innerHTML = '<i class="fas fa-search-plus"></i> Expand';
                expandBtn.onclick = () => mapPrompt('expand', content);

                // Special action button for HTML execution
                const executeBtn = document.createElement('button');
                executeBtn.className = 'action-button special-action-button';
                executeBtn.innerHTML = '<i class="fas fa-play"></i> Execute';
                executeBtn.onclick = () => executeHtmlCode(content);

                actionsDiv.appendChild(copyBtn);
                actionsDiv.appendChild(listenBtn);
                actionsDiv.appendChild(downloadBtn);
                actionsDiv.appendChild(summarizeBtn);
                actionsDiv.appendChild(rephraseBtn);
                actionsDiv.appendChild(expandBtn);
                actionsDiv.appendChild(executeBtn);
                messageDiv.appendChild(actionsDiv);
            }

            chatBody.appendChild(messageDiv);
            chatBody.scrollTop = chatBody.scrollHeight;

            // Trigger Prism.js highlighting for new code blocks
            if (typeof Prism !== 'undefined') {
                Prism.highlightAllUnder(messageDiv);
            }
        }

        function formatMessage(content) {
            const codeBlocks = [];
            content = content.replace(/```(\w+)?\n([\s\S]*?)```/g, (match, lang, code) => {
                const language = (lang || 'html').toLowerCase();
                const codeId = 'code-' + Math.random().toString(36).substr(2, 9);
                const escaped = escapeHtml(code);
                const hideRunButtonFor = ['html', 'xml', 'doctype'];

                const copyBtn = `
                    <button class="copy-code-btn" onclick="copyCodeToClipboard('${codeId}')">
                        <i class="fas fa-copy"></i> Copy
                    </button>`;

                const runBtn = !hideRunButtonFor.includes(language)
                    ? `<button class="run-html-btn" onclick="runHtmlCode('${codeId}')">
                        <i class="fas fa-play"></i> Run HTML
                    </button>`
                    : '';

                const block = `
                    <div class="code-block-wrapper">
                        <pre class="line-numbers"><code id="${codeId}" class="language-${language}">${escaped}</code></pre>
                        <div class="code-header" style="border-top: 1px solid #1e90ff; justify-content: flex-end;">
                            ${copyBtn}
                            ${runBtn}
                        </div>
                    </div>
                `;
                codeBlocks.push(block);
                return `[[CODE_BLOCK_${codeBlocks.length - 1}]]`;
            });

            let formatted = content
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^#### (.*$)/gim, '<h4>$1</h4>')
                .replace(/^##### (.*$)/gim, '<h5>$1</h5>')
                .replace(/^###### (.*$)/gim, '<h6>$1</h6>')
                .replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/^- (.*$)/gim, '<ul><li>$1</li></ul>')
                .replace(/<\/ul>\s*<ul>/g, '')
                .replace(/\n/g, '<br>');

            codeBlocks.forEach((block, index) => {
                const placeholder = `[[CODE_BLOCK_${index}]]`;
                formatted = formatted.replace(placeholder, block);
            });

            return formatted;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Enhanced Code Copy Function
        window.copyCodeToClipboard = function(codeId) {
            const codeElement = document.getElementById(codeId);
            const text = codeElement.textContent;
            navigator.clipboard.writeText(text).then(() => {
                // Visual feedback
                const button = document.querySelector(`button[onclick="copyCodeToClipboard('${codeId}')"]`);
                const originalText = button.innerHTML;
                button.innerHTML = '<i class="fas fa-check"></i> Copied!';
                button.style.background = 'linear-gradient(45deg, #68d391, #38b2ac)';
                setTimeout(() => {
                    button.innerHTML = originalText;
                    button.style.background = 'linear-gradient(45deg, #1e90ff, #0078FF)';
                }, 2000);
            });
        }

        // Run HTML Code Function
        window.runHtmlCode = function(codeId) {
            const codeElement = document.getElementById(codeId);
            const htmlCode = codeElement.textContent;

            // Create a new window or tab to display the HTML code
            const newWindow = window.open('', '_blank');
            newWindow.document.write(htmlCode);
            newWindow.document.close();
        }

        function containsHtmlCode(content) {
            // Check if the content contains HTML code blocks
            return /```html\n([\s\S]*?)```/.test(content);
        }

        function extractHtmlCode(content) {
            // Extract HTML code from the content
            const htmlCodeMatch = content.match(/```html\n([\s\S]*?)```/);
            if (htmlCodeMatch && htmlCodeMatch[1]) {
                return htmlCodeMatch[1];
            }
            return null;
        }

        function addHtmlPreview(messageDiv, htmlCode) {
            // Create a container for the HTML preview
            const previewContainer = document.createElement('div');
            previewContainer.className = 'html-preview-container';

            // Create header for the preview
            const previewHeader = document.createElement('div');
            previewHeader.className = 'html-preview-header';
            previewHeader.textContent = 'HTML Preview';
            previewContainer.appendChild(previewHeader);

            // Create content area for the preview
            const previewContent = document.createElement('div');
            previewContent.className = 'html-preview-content';

            // Create iframe to display the HTML
            const iframe = document.createElement('iframe');
            iframe.className = 'html-preview-iframe';
            iframe.srcdoc = htmlCode;
            previewContent.appendChild(iframe);
            previewContainer.appendChild(previewContent);

            // Create actions for the preview
            const previewActions = document.createElement('div');
            previewActions.className = 'html-preview-actions';

            // Add copy button
            const copyBtn = document.createElement('button');
            copyBtn.className = 'preview-action-button';
            copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy HTML';
            copyBtn.onclick = () => copyToClipboard(htmlCode);
            previewActions.appendChild(copyBtn);

            // Add fullscreen button
            const fullscreenBtn = document.createElement('button');
            fullscreenBtn.className = 'preview-action-button';
            fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i> Fullscreen';
            fullscreenBtn.onclick = () => openFullscreenPreview(htmlCode);
            previewActions.appendChild(fullscreenBtn);

            previewContainer.appendChild(previewActions);
            messageDiv.appendChild(previewContainer);
        }

        function openFullscreenPreview(htmlCode) {
            // Open a new window to display the HTML in fullscreen
            const newWindow = window.open('', '_blank');
            newWindow.document.write(htmlCode);
            newWindow.document.close();
        }

        // Execute HTML Code Function (Special Action)
        function executeHtmlCode(content) {
            // Extract HTML code from the content
            const htmlCode = extractHtmlCode(content);
            if (htmlCode) {
                // Create a new window or tab to display the HTML code
                const newWindow = window.open('', '_blank');
                newWindow.document.write(htmlCode);
                newWindow.document.close();
            } else {
                addMessage('system', '⚠️ No HTML code found in the message', true);
            }
        }

        // Prompt Mapping Function
        function mapPrompt(action, content) {
            let mappedPrompt = '';

            switch (action) {
                case 'summarize':
                    mappedPrompt = `Please summarize the following:\n\n${content}`;
                    break;
                case 'rephrase':
                    mappedPrompt = `Can you rephrase this more clearly?\n\n${content}`;
                    break;
                case 'expand':
                    mappedPrompt = `Expand this explanation with technical detail:\n\n${content}`;
                    break;
            }

            messageInput.value = mappedPrompt;
            // Focus on input field
            messageInput.focus();
        }

        // Main Chat Function with Streaming Support
        async function sendMessage() {
            if (isProcessing) return;

            const message = messageInput.value.trim();
            if (!message) return;

            setLoading(true);
            addMessage('user', message);

            // Create a copy of the chat history
            let currentChatHistory = [...chatHistory];

            // Add the new user message
            currentChatHistory.push({ role: 'user', content: message });

            // Add system prompt for context
            currentChatHistory.unshift({
                role: 'system',
                content: "You are GPTurbo, an elite AI developed by Genitus Inc. Your job is to respond like a senior AI consultant specialized in financial systems, enterprise SaaS, and scalable automation. Use professional tone unless told otherwise."
            });

            messageInput.value = '';

            try {
                // Create a new assistant message container for streaming
                const assistantMessageDiv = document.createElement('div');
                assistantMessageDiv.className = 'message assistant-message';
                const contentDiv = document.createElement('div');
                assistantMessageDiv.appendChild(contentDiv);
                chatBody.appendChild(assistantMessageDiv);
                chatBody.scrollTop = chatBody.scrollHeight;

                // Initialize streaming response
                const response = await fetch(`${BACKEND_URL}/api/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini',
                        messages: currentChatHistory,
                        temperature: 0.7,
                        max_tokens: 10000,
                        stream: true
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let assistantMessage = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') {
                                // Streaming complete
                                break;
                            }

                            try {
                                const parsed = JSON.parse(data);
                                if (parsed.choices && parsed.choices[0] && parsed.choices[0].delta && parsed.choices[0].delta.content) {
                                    const delta = parsed.choices[0].delta.content;
                                    assistantMessage += delta;
                                    contentDiv.innerHTML = formatMessage(assistantMessage);
                                    chatBody.scrollTop = chatBody.scrollHeight;
                                }
                            } catch (e) {
                                console.error('Error parsing stream data:', e);
                            }
                        }
                    }
                }

                // Finalize the assistant message
                chatHistory.push({ role: 'user', content: message });
                chatHistory.push({ role: 'assistant', content: assistantMessage });

                // Check if the message contains HTML code and add preview
                if (containsHtmlCode(assistantMessage)) {
                    const htmlCode = extractHtmlCode(assistantMessage);
                    if (htmlCode) {
                        addHtmlPreview(assistantMessageDiv, htmlCode);
                    }
                }

                // Add action buttons to the final message
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'message-actions';

                const copyBtn = document.createElement('button');
                copyBtn.className = 'action-button copy-button';
                copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy';
                copyBtn.onclick = () => copyToClipboard(assistantMessage);

                const listenBtn = document.createElement('button');
                listenBtn.className = 'action-button listen-button';
                listenBtn.innerHTML = '<i class="fas fa-volume-up"></i> Listen';
                listenBtn.onclick = () => speakText(assistantMessage);

                const downloadBtn = document.createElement('button');
                downloadBtn.className = 'action-button download-button';
                downloadBtn.innerHTML = '<i class="fas fa-download"></i> Download';
                downloadBtn.onclick = () => downloadText(assistantMessage, 'genitus-gpt-response.txt');

                const summarizeBtn = document.createElement('button');
                summarizeBtn.className = 'action-button prompt-button';
                summarizeBtn.innerHTML = '<i class="fas fa-compress-alt"></i> Summarize';
                summarizeBtn.onclick = () => mapPrompt('summarize', assistantMessage);

                const rephraseBtn = document.createElement('button');
                rephraseBtn.className = 'action-button prompt-button';
                rephraseBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Rephrase';
                rephraseBtn.onclick = () => mapPrompt('rephrase', assistantMessage);

                const expandBtn = document.createElement('button');
                expandBtn.className = 'action-button prompt-button';
                expandBtn.innerHTML = '<i class="fas fa-search-plus"></i> Expand';
                expandBtn.onclick = () => mapPrompt('expand', assistantMessage);

                const executeBtn = document.createElement('button');
                executeBtn.className = 'action-button special-action-button';
                executeBtn.innerHTML = '<i class="fas fa-play"></i> Execute';
                executeBtn.onclick = () => executeHtmlCode(assistantMessage);

                actionsDiv.appendChild(copyBtn);
                actionsDiv.appendChild(listenBtn);
                actionsDiv.appendChild(downloadBtn);
                actionsDiv.appendChild(summarizeBtn);
                actionsDiv.appendChild(rephraseBtn);
                actionsDiv.appendChild(expandBtn);
                actionsDiv.appendChild(executeBtn);

                assistantMessageDiv.appendChild(actionsDiv);
                chatBody.scrollTop = chatBody.scrollHeight;

                // Trigger Prism.js highlighting for new code blocks
                if (typeof Prism !== 'undefined') {
                    Prism.highlightAllUnder(assistantMessageDiv);
                }

            } catch (error) {
                console.error('Chat error:', error);
                addMessage('system', `❌ Error: ${error.message}`, true);
            } finally {
                setLoading(false);
            }
        }

        // DALL-E Image Generation
        async function generateImage() {
            if (isProcessing) return;

            const prompt = messageInput.value.trim();
            if (!prompt) {
                addMessage('system', '⚠️ Please enter an image description', true);
                return;
            }

            setLoading(true, 'dalle');
            addMessage('user', `🎨 Generate image: ${prompt}`);
            messageInput.value = '';

            try {
                const response = await fetch(`${BACKEND_URL}/api/images/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        prompt: prompt,
                        size: "1024x1024",
                        quality: "standard",
                        style: "vivid"
                    })
                });

                if (!response.ok) {
                    throw new Error(`DALL-E error: ${response.status}`);
                }

                const data = await response.json();
                if (data.data && data.data[0] && data.data[0].url) {
                    const imageUrl = data.data[0].url;
                    const messageDiv = document.createElement('div');
                    messageDiv.className = 'message assistant-message';

                    messageDiv.innerHTML = `
                        <p>Generated image: ${prompt}</p>
                        <div class="image-message">
                            <img src="${imageUrl}" alt="Generated image" loading="lazy">
                        </div>
                        <div class="message-actions">
                            <button class="action-button copy-button" onclick="copyToClipboard('${imageUrl}')">
                                <i class="fas fa-copy"></i> Copy URL
                            </button>
                            <button class="action-button download-button" onclick="downloadImage('${imageUrl}', 'genitus-dalle-image-${Date.now()}.png')">
                                <i class="fas fa-download"></i> Download
                            </button>
                        </div>
                    `;

                    chatBody.appendChild(messageDiv);
                    chatBody.scrollTop = chatBody.scrollHeight;
                } else {
                    throw new Error('Invalid image response');
                }
            } catch (error) {
                console.error('Image generation error:', error);
                addMessage('system', `❌ Image generation failed: ${error.message}`, true);
            } finally {
                setLoading(false, 'dalle');
            }
        }

        // Utility Functions
        function setLoading(loading, buttonType = 'send') {
            isProcessing = loading;
            const button = buttonType === 'dalle' ? dalleButton : sendButton;
            const icon = button.querySelector('.icon');
            const spinner = button.querySelector('.spinner-border');

            if (loading) {
                button.classList.add('loading');
                icon.style.visibility = 'hidden';
                spinner.style.display = 'inline-block';
                button.disabled = true;
            } else {
                button.classList.remove('loading');
                icon.style.visibility = 'visible';
                spinner.style.display = 'none';
                button.disabled = false;
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                // Visual feedback could be added here
            });
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.8;
                utterance.pitch = 1;
                speechSynthesis.speak(utterance);
            } else {
                addMessage('system', '⚠️ Text-to-speech not supported in this browser', true);
            }
        }

        function downloadImage(url, filename) {
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function downloadText(text, filename) {
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>
