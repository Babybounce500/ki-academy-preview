    <script>
        // Your API Key
        const apiEndpoint = "/mistral/v1/chat/completions"; // The actual API endpoint
        const selectedModel = "codestral-latest"; // Set Codestral as the default model
        let chatHistory = [];
        let userPromptElement = document.getElementById("userPrompt");
        let chatHistoryElement = document.getElementById("chatHistory");
        let uploadedFileContent = null;

        function getUploadedFileContent() {
            return uploadedFileContent;
        }

        async function fetchChatCompletion() {
            const prompt = userPromptElement.value;
            if (!prompt) {
                alert("Please enter a message");
                return;
            }
            document.getElementById('loading').style.display = 'block';
            chatHistory.push({role: "user", content: prompt});
            const fileContent = getUploadedFileContent();
            if (fileContent) {
                chatHistory.push({role: "user", content: fileContent});
            }
            updateChatDisplay();
            const requestBody = {
                model: selectedModel,
                temperature: 0.7,
                top_p: 1,
                max_tokens: 256000,
                stream: false,
                messages: [
                    { role: "system", content: "You are a high-end senior web developer with expertise in HTML5, CSS3, Media Queries, and JavaScript. You are a CSS3 media query master and a JavaScript professor." },
                    ...chatHistory
                ],
                response_format: { type: 'text' },
                tool_choice: 'auto',
                presence_penalty: 0,
                frequency_penalty: 0,
                n: 1,
                prediction: { type: 'content', content: '' },
                safe_prompt: false
            };
            try {
                const response = await fetch(apiEndpoint, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        },
                    body: JSON.stringify(requestBody)
                });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                const assistantMessage = data.choices[0].message.content.trim();
                chatHistory.push({role: "assistant", content: assistantMessage});
                document.getElementById('generatedHtml').value = assistantMessage;
                updateChatDisplay();
                userPromptElement.value = "";
            } catch (error) {
                console.error("Error fetching chat completion:", error);
                alert("Error fetching chat completion. Please try again.");
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function updateChatDisplay() {
    chatHistoryElement.innerHTML = "";

    chatHistory.forEach(message => {
        const messageDiv = document.createElement("div");
        messageDiv.classList.add(message.role === "user" ? "user-message" : "assistant-message");

        // ✅ FIXED Regex — erkennt ```lang\ncode\n``` korrekt
        const codeBlockRegex = /```(\w+)?\n([\s\S]*?)```/g;

        let lastIndex = 0;
        let match;

        while ((match = codeBlockRegex.exec(message.content)) !== null) {
            // Text vor dem Codeblock
            if (match.index > lastIndex) {
                const text = message.content.substring(lastIndex, match.index);
                messageDiv.appendChild(document.createTextNode(text));
            }

            const language = match[1] || 'plaintext';
            const code = match[2];

            const pre = document.createElement("pre");
            const codeElement = document.createElement("code");
            codeElement.className = `language-${language}`;
            codeElement.textContent = code;
            pre.appendChild(codeElement);
            messageDiv.appendChild(pre);

            lastIndex = codeBlockRegex.lastIndex;
        }

        // Text nach dem letzten Codeblock
        if (lastIndex < message.content.length) {
            const remainingText = message.content.substring(lastIndex);
            messageDiv.appendChild(document.createTextNode(remainingText));
        }

        chatHistoryElement.appendChild(messageDiv);
    });

    // ✨ Highlight aktivieren
    Prism.highlightAll();

    // 📜 Scroll to bottom
    chatHistoryElement.scrollTop = chatHistoryElement.scrollHeight;
}

        function uploadChatFile() {
            const fileInput = document.getElementById("chatFileInput");
            const selectedFile = fileInput.files[0];
            if (!selectedFile) {
                alert("Please select a file to upload.");
                return;
            }
            const reader = new FileReader();
            reader.onload = function (event) {
                uploadedFileContent = event.target.result;
                console.log("File content:", uploadedFileContent);
                alert("File uploaded successfully!");
            };
            reader.readAsText(selectedFile);
        }

        document.addEventListener("DOMContentLoaded", function () {
            let textArea = document.getElementById("userPrompt");
            textArea.addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    fetchChatCompletion();
                }
            });
        });

        function deleteUploadedFile() {
            uploadedFileContent = null;
            alert("Uploaded file content deleted.");
        }

        function runGeneratedHtml() {
            const htmlContent = document.getElementById('generatedHtml').value;
            if (!htmlContent) {
                alert("No HTML content to run!");
                return;
            }
            const newWindow = window.open();
            newWindow.document.open();
            newWindow.document.write(htmlContent);
            newWindow.document.close();
        }

        function downloadSnippet() {
            const assistantMessages = document.querySelectorAll(".assistant-message pre code");
            if (assistantMessages.length > 0) {
                const lastCodeBlock = assistantMessages[assistantMessages.length - 1];
                const snippet = lastCodeBlock.textContent;
                const blob = new Blob([snippet], { type: "text/html" });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "snippet.html";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                alert("Snippet downloaded as HTML file!");
            } else {
                alert("No code snippet to download!");
            }
        }

        function highlightLastAssistantResponse() {
            const assistantMessages = document.querySelectorAll(".assistant-message pre code");
            if (assistantMessages.length > 0) {
                const lastCodeBlock = assistantMessages[assistantMessages.length - 1];
                lastCodeBlock.classList.add("highlighted");
                const range = document.createRange();
                range.selectNodeContents(lastCodeBlock);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                try {
                    document.execCommand("copy");
                    alert("Code snippet copied to clipboard!");
                } catch (err) {
                    console.error("Error copying text: ", err);
                }
                setTimeout(() => {
                    lastCodeBlock.classList.remove("highlighted");
                    selection.removeAllRanges();
                }, 1000);
            } else {
                alert("No code snippet to highlight!");
            }
        }

        document.addEventListener('paste', function (event) {
            var items = event.clipboardData.items;
            for (var i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    var blob = items[i].getAsFile();
                    var reader = new FileReader();
                    reader.onload = function (event) {
                        var base64Image = event.target.result;
                        var imgTag = '<img src="' + base64Image + '" />';
                        editor.session.insert(editor.getCursorPosition(), imgTag);
                    };
                    reader.readAsDataURL(blob);
                }
            }
        });

        function saveConversation() {
            localStorage.setItem('chatHistory', JSON.stringify(chatHistory));
            alert("Conversation saved!");
        }

        function loadConversation() {
            const storedChatHistory = localStorage.getItem('chatHistory');
            if (storedChatHistory) {
                chatHistory = JSON.parse(storedChatHistory);
                updateChatDisplay();
            }
        }

        function clearChatHistory() {
            chatHistory = [];
            updateChatDisplay();
            localStorage.removeItem('chatHistory');
            alert("Chat history cleared!");
        }

        window.addEventListener('load', function () {
            loadConversation();
        });

        function adjustChatHeight() {
            const headerHeight = document.querySelector('.navbar').offsetHeight;
            const container = document.querySelector('.container');
            container.style.height = `calc(100% - ${headerHeight}px)`;
        }

        window.addEventListener('resize', adjustChatHeight);
        window.addEventListener('load', adjustChatHeight);

        function openEditorTab() {
            window.open('https://domusaurea.tech/HTML3.html', '_blank');
        }

        // Toggle Sidebar Functionality
        document.getElementById('toggleSidebar').addEventListener('click', function () {
            const sidebar = document.querySelector('.right-sidebar');
            sidebar.classList.toggle('hidden');
        });
    </script>
