<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive HTML Editor for Mobile Devices</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }
    #editorWrapper {
        margin-bottom: 20px;
    }
    #editor {
        height: 200px;
        background-color: #f4f4f4;
        border: 1px solid #ccc;
        padding: 10px;
        border-radius: 5px;
        overflow: auto;
        resize: none;
    }
    #outputWrapper {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
    }
    #output {
        flex-grow: 1;
        width: 100%;
        border: 1px solid #ccc;
        border-radius: 5px;
        overflow: auto;
    }
</style>
</head>
<body>

<div id="editorWrapper">
    <h2>Responsive HTML Editor</h2>
    <textarea id="editor" placeholder="Write some HTML..."></textarea>
    <div>
        <button class="btn btn-primary" onclick="runCode()">Run</button>
        <button class="btn btn-secondary" onclick="insertFromClipboard()">Insert</button>
        <button class="btn btn-danger" onclick="eraseContent()">Erase</button>
        <button class="btn btn-success" onclick="downloadCode()">DL</button> <!-- Neuer Button -->
    </div>
</div>

<div id="outputWrapper">
    <h3>Output</h3>
    <iframe id="output"></iframe>
</div>

<script>
function runCode() {
    var htmlContent = document.getElementById('editor').value;
    var iframe = document.getElementById('output').contentWindow.document;
    iframe.open();
    iframe.write(htmlContent);
    iframe.close();
}

async function insertFromClipboard() {
    try {
        const text = await navigator.clipboard.readText();
        document.getElementById('editor').value += text;
    } catch (err) {
        console.error('Failed to read from clipboard: ', err);
    }
}

function eraseContent() {
    document.getElementById('editor').value = '';
}

function downloadCode() {
    var htmlContent = document.getElementById('editor').value;
    var blob = new Blob([htmlContent], {type: "text/html"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = "downloaded_code.html";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
